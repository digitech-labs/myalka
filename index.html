        :root {
            --shadow-glass: 0 10px 40px -10px rgba(0,0,0,0.08);
            --inset-glass: inset 0 1px 0 rgba(255,255,255,0.8), inset 1px 0 0 rgba(255,255,255,0.3);
        }

        body {
            font-family: 'Inter', sans-serif; color: theme('colors.brand.navy');
            background-color: #f8fafc;
            background-image: radial-gradient(ellipse at 0% 0%, #cde8fb 0%, transparent 60%), radial-gradient(ellipse at 100% 0%, #ffe0cc 0%, transparent 60%), radial-gradient(ellipse at 100% 100%, #fff5e6 0%, transparent 60%), radial-gradient(ellipse at 0% 100%, #dcf0ff 0%, transparent 60%);
            background-attachment: fixed; min-height: 100vh; min-height: 100dvh;
            overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.9); border-left: 1.5px solid rgba(255, 255, 255, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-glass), var(--inset-glass);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .glass-popup { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-popup.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        .slider-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .slider-scroll::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.22); border-radius: 10px; }
        .slider-scroll::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.38); }
        .slider-scroll::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.8); border-radius: 10px; }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: theme('colors.brand.muted'); font-size: 11px; font-weight: 600; flex: 1; height: 100%; position: relative; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item.active { color: theme('colors.brand.blue'); }
        .nav-item.active i { transform: translateY(-2px) scale(1.15); stroke-width: 2.5px; }
        .nav-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; border-radius: 0 0 4px 4px; background-color: theme('colors.brand.blue'); opacity: 0; transition: opacity 0.3s; }
        .nav-item.active .nav-indicator { opacity: 1; }

        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-glass { background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.9); border-radius: 8px; padding: 6px 10px; width: 100%; outline: none; transition: all 0.2s; font-size: 12px; color: #0f172a; }
        .input-glass:focus { border-color: #3b82f6; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        
        #modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, 0.28); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px; }
        #modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { animation: modalZoom 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; background: rgba(255, 255, 255, 0.96); }
        @keyframes modalZoom { from { transform: scale(0.9) translateY(12px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border: 1px solid rgba(226,232,240,0.9); padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); font-size: 13px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .draggable-row { transition: background-color 0.2s; }
        .draggable-row.dragging { opacity: 0.4; background: rgba(59, 130, 246, 0.1); }
        .draggable-row.drag-over { border-top: 2px solid #3b82f6; }
        .grip-handle { cursor: grab; user-select: none; }
        .grip-handle:active { cursor: grabbing; }

        /* 100% SOLID OPAQUE STICKY COLUMNS & HEADERS */
        .sticky-col-1 { position: sticky; left: 0; z-index: 25; background-color: #ffffff !important; border-right: 1px solid #cbd5e1; }
        .sticky-col-2 { position: sticky; left: 60px; z-index: 25; background-color: #ffffff !important; border-right: 1px solid #cbd5e1; }
        .sticky-col-3 { position: sticky; left: 120px; z-index: 25; background-color: #ffffff !important; border-right: 2px solid #cbd5e1; box-shadow: 4px 0 8px -2px rgba(15, 23, 42, 0.08); }
        .sticky-action-cell { position: sticky; right: 0; z-index: 25; background-color: #ffffff !important; border-left: 2px solid #cbd5e1; box-shadow: -4px 0 8px -2px rgba(15, 23, 42, 0.06); }

        tr:hover .sticky-col-1,
        tr:hover .sticky-col-2,
        tr:hover .sticky-col-3,
        tr:hover .sticky-action-cell {
            background-color: #f1f5f9 !important;
        }

        .sticky-col-1-header { position: sticky; top: 0; left: 0; z-index: 50; background-color: #e2e8f0 !important; border-right: 1px solid #94a3b8; border-bottom: 2px solid #94a3b8; }
        .sticky-col-2-header { position: sticky; top: 0; left: 60px; z-index: 50; background-color: #e2e8f0 !important; border-right: 1px solid #94a3b8; border-bottom: 2px solid #94a3b8; }
        .sticky-col-3-header { position: sticky; top: 0; left: 120px; z-index: 50; background-color: #e2e8f0 !important; border-right: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; box-shadow: 4px 2px 8px -2px rgba(15, 23, 42, 0.12); }

        .sticky-top-th { position: sticky; top: 0; z-index: 35; border-bottom: 2px solid #94a3b8; border-right: 1px solid #cbd5e1; }
        .sticky-action-header { position: sticky; top: 0; right: 0; z-index: 50; background-color: #e2e8f0 !important; border-left: 2px solid #94a3b8; border-bottom: 2px solid #94a3b8; box-shadow: -4px 2px 8px -2px rgba(15, 23, 42, 0.1); }

        /* CUTE & EYE-CATCHING PWA INSTALL POPUP ANIMATIONS */
        @keyframes cuteFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-7px) rotate(3deg); }
        }
        @keyframes cuteWiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-9deg) scale(1.1); }
            75% { transform: rotate(9deg) scale(1.1); }
        }
        @keyframes shimmerSweep {
            0% { transform: translateX(-120%) skewX(-15deg); }
            100% { transform: translateX(220%) skewX(-15deg); }
        }
        @keyframes popBounceIn {
            0% { opacity: 0; transform: translateY(45px) scale(0.82); }
            70% { opacity: 1; transform: translateY(-7px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }

        @keyframes pulseGlow {

        window.generateAlkaAppIcon = function(size) {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const r = size * 0.24;

                const bgGrad = ctx.createLinearGradient(0, 0, size, size);
                bgGrad.addColorStop(0, '#ffffff');
                bgGrad.addColorStop(0.6, '#f0f9ff');
                bgGrad.addColorStop(1, '#e0f2fe');

                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(size - r, 0);
                ctx.quadraticCurveTo(size, 0, size, r);
                ctx.lineTo(size, size - r);
                ctx.quadraticCurveTo(size, size, size - r, size);
                ctx.lineTo(r, size);
                ctx.quadraticCurveTo(0, size, 0, size - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                ctx.fillStyle = bgGrad;
                ctx.fill();

                ctx.save();
                const scale = size / 100;
                ctx.scale(scale, scale);

                const p1 = new Path2D("M50 85C25 85 15 65 15 45C15 25 35 15 50 15C50 15 45 40 50 50C55 60 70 65 85 65C85 75 75 85 50 85Z");
                const grad1 = ctx.createLinearGradient(15, 50, 60, 85);
                grad1.addColorStop(0, '#2878F0');
                grad1.addColorStop(1, '#38bdf8');
                ctx.fillStyle = grad1;
                ctx.fill(p1);

                const p2 = new Path2D("M50 15C75 15 85 35 85 55C85 75 65 85 50 85C50 85 55 60 50 50C45 40 30 35 15 35C15 25 25 15 50 15Z");
                const grad2 = ctx.createLinearGradient(85, 50, 40, 15);
                grad2.addColorStop(0, '#f97316');
                grad2.addColorStop(1, '#fde047');
                ctx.fillStyle = grad2;
                ctx.fill(p2);

                ctx.restore();
                return canvas.toDataURL('image/png');
            } catch (e) {
                return '';
            }
        };

        window.exportPremiumExcel = function({ sheetName, fileName, columns, rowsData }) {
            const headers = columns.map(c => c.header);
            const aoa = [headers, ...rowsData];
            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const range = XLSX.utils.decode_range(ws['!ref']);

            ws['!rows'] = [{ hpt: 32 }];
            for (let r = 1; r <= range.e.r; r++) {
                ws['!rows'].push({ hpt: 24 });
            }

            ws['!cols'] = columns.map((col, cIdx) => {
                let maxLen = col.header.length;
                for (let r = 0; r < rowsData.length; r++) {
                    const valStr = String(rowsData[r][cIdx] ?? '');
                    if (valStr.length > maxLen) maxLen = valStr.length;
                }
                const minW = col.minW || 11;
                const maxW = col.maxW || 46;
                return { wch: Math.min(Math.max(maxLen + 5, minW), maxW) };
            });

            ws['!autofilter'] = { ref: XLSX.utils.encode_range(range) };

            for (let r = range.s.r; r <= range.e.r; r++) {
                for (let c = range.s.c; c <= range.e.c; c++) {
                    const cellRef = XLSX.utils.encode_cell({ r, c });
                    if (!ws[cellRef]) ws[cellRef] = { t: 's', v: '' };

                    ws[cellRef].t = 's';
                    ws[cellRef].v = String(ws[cellRef].v ?? '');

                    const colCfg = columns[c] || {};
                    const theme = EXCEL_HEADER_THEMES[colCfg.group] || EXCEL_HEADER_THEMES.identity;

                    if (r === 0) {
                        ws[cellRef].s = {
                            fill: { patternType: 'solid', fgColor: { rgb: theme.bg } },
                            font: { name: 'Segoe UI', sz: 10, bold: true, color: { rgb: theme.fg } },
                            alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
                            border: {
                                top:    { style: 'medium', color: { rgb: '0F172A' } },
                                bottom: { style: 'medium', color: { rgb: '0F172A' } },
                                left:   { style: 'thin',   color: { rgb: '94A3B8' } },
                                right:  { style: 'thin',   color: { rgb: '94A3B8' } }
                            }
                        };
                    } else {
                        const isEvenRow = r % 2 === 0;
                        let rowBg = isEvenRow ? 'F8FAFC' : 'FFFFFF';
                        if (colCfg.key === 'no') rowBg = isEvenRow ? 'E2E8F0' : 'F1F5F9';
                        if (colCfg.bold) rowBg = isEvenRow ? 'EFF6FF' : 'F8FAFC';

                        ws[cellRef].s = {
                            fill: { patternType: 'solid', fgColor: { rgb: rowBg } },
                            font: {
                                name: 'Segoe UI',
                                sz: 10,
                                bold: Boolean(colCfg.bold || colCfg.key === 'no'),
                                color: { rgb: colCfg.bold ? '1E3A8A' : '0F172A' }
                            },
                            alignment: {
                                horizontal: colCfg.align || 'left',
                                vertical: 'center',
                                wrapText: false
                            },
                            border: {
                                top:    { style: 'thin', color: { rgb: 'CBD5E1' } },
                                bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
                                left:   { style: 'thin', color: { rgb: 'CBD5E1' } },
                                right:  { style: 'thin', color: { rgb: 'CBD5E1' } }
                            }
                        };
                    }
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, fileName);

        window.formatDateId = function(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let parts = String(dateStr).split('-');
            if (parts.length !== 3) return dateStr;
            let day, month, year;
            if (parts[0].length === 4) { year = parts[0]; month = parts[1]; day = parts[2]; } else { day = parts[0]; month = parts[1]; year = parts[2]; } 
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            const mIndex = parseInt(month, 10) - 1;
            if (mIndex >= 0 && mIndex < 12) return `${parseInt(day, 10)} ${months[mIndex]} ${year}`;
            return dateStr;
        };

        window.syncRelationalTables = async function(silent = false) {
            if (!supabaseClient) return;
            try {
                if (Array.isArray(window.DB.siswa) && window.DB.siswa.length > 0) {
                    const siswaSqlRows = window.DB.siswa.map((s, idx) => window.mapSiswaToSqlRow(s, idx));
                    const chunkSize = 200;
                    for (let i = 0; i < siswaSqlRows.length; i += chunkSize) {
                        const chunk = siswaSqlRows.slice(i, i + chunkSize);
                        const { error: siswaErr } = await supabaseClient.from('siswa').upsert(chunk, { onConflict: 'id' });
                        if (siswaErr) throw new Error(`Tabel siswa: ${siswaErr.message}`);
                    }
                    await supabaseClient.from('siswa').delete().gt('id', siswaSqlRows.length);
                }

                if (Array.isArray(window.DB.guru) && window.DB.guru.length > 0) {
                    const guruSqlRows = window.DB.guru.map((g, idx) => window.mapGuruToSqlRow(g, idx));
                    const { error: guruErr } = await supabaseClient.from('guru').upsert(guruSqlRows, { onConflict: 'id' });
                    if (guruErr) throw new Error(`Tabel guru: ${guruErr.message}`);
                    await supabaseClient.from('guru').delete().gt('id', guruSqlRows.length);
                }
                return true;
            } catch (relErr) {
                if (!silent) {
                    window.showToast('Gagal isi tabel siswa/guru: Matikan RLS tabel siswa di SQL Editor Supabase!', 'alert-triangle', 'text-orange-500');
                }
                return false;
            }
        };

        async function initCloud() {

                const { data, error } = await supabaseClient.from('portal_state').select('data').eq('id', 1).maybeSingle();
                if (!error && data && data.data && Object.keys(data.data).length > 0) {
                    const cloudDB = data.data;
                    if (cloudDB.menus) window.DB.menus = cloudDB.menus;
                    if (cloudDB.apps) window.DB.apps = cloudDB.apps;
                    if (cloudDB.users) window.DB.users = cloudDB.users;
                    if (cloudDB.logs) window.DB.logs = cloudDB.logs;
                    if (cloudDB.guru) window.DB.guru = cloudDB.guru;
                    if (cloudDB.siswa) window.DB.siswa = cloudDB.siswa;
                    window.ensureNaturalSiswaOrder();

                    // Otomatis isi tabel relasional siswa & guru jika data sudah ada di portal_state
                    window.syncRelationalTables(true);
                }
                window.render();

                if (!isCanvasSandbox()) {
                    const channel = supabaseClient.channel('custom-all-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_state' }, (payload) => {
                        const newData = payload.new && payload.new.data ? payload.new.data : null;
                        if (newData) {
                            if (newData.menus) window.DB.menus = newData.menus;
                            if (newData.apps) window.DB.apps = newData.apps;
                            if (newData.users) window.DB.users = newData.users;
                            if (newData.logs) window.DB.logs = newData.logs;
                            if (newData.guru) window.DB.guru = newData.guru;
                            if (newData.siswa) window.DB.siswa = newData.siswa;
                            window.ensureNaturalSiswaOrder();
                            window.render();
                        }
                    });
                    channel.subscribe();
                }
            } catch (err) {
                window.render();
            }
        }

            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
                if (json.length === 0) {
                    window.showToast('File Excel kosong!', 'alert-circle', 'text-orange-500');
                    return;
                }
                const newGuruList = [];
                json.forEach((row, i) => {
                    const rowNik = String(row['NIK'] || '').trim();
                    const rowNama = String(row['NAMA PEGAWAI'] || row['NAMA'] || '').trim();
                    let existing = window.DB.guru.find(x => (rowNik && String(x.nik) === rowNik) || (rowNama && x.nama.toLowerCase() === rowNama.toLowerCase()));
                    let g = existing ? { ...existing } : { id: Date.now() + i, status: true, waliKelas: '', tugasTambahan: '', pelatihEkstra: '', mapel1: '', kelasMapel1: '', mapel2: '', kelasMapel2: '', mapel3: '', kelasMapel3: '', mapel4: '', kelasMapel4: '', mapel5: '', kelasMapel5: '', mapel6: '', kelasMapel6: '' };
                    GURU_COLUMNS_CONFIG.forEach(col => {
                        if (col.key === 'no') return;
                        if (row[col.header] !== undefined && row[col.header] !== '') {
                            g[col.key] = row[col.header];
                        } else if (col.alt) {
                            for (const altKey of col.alt) {
                                if (row[altKey] !== undefined && row[altKey] !== '') { g[col.key] = row[altKey]; break; }
                            }
                        } else if (row[col.header] !== undefined) {
                            g[col.key] = row[col.header];
                        }
                    });
                    newGuruList.push(g);
                });
                window.DB.guru = newGuruList;
                window.logActivity('Import Excel Pegawai', json.length + ' Baris', 'Pegawai', 'blue');
                window.render();
                document.getElementById('fileGuru').value = '';
            };
            reader.readAsArrayBuffer(file);

        window.downloadFormatTugas = function() {
            const rowsData = window.DB.guru.map((g, idx) =>
                TUGAS_COLUMNS_CONFIG.map(col => col.key === 'no' ? String(idx + 1) : (g[col.key] || ''))
            );
            window.exportPremiumExcel({
                sheetName: 'Tugas Pegawai',
                fileName: 'Format_Tugas_Pegawai.xlsx',
                columns: TUGAS_COLUMNS_CONFIG,
                rowsData
            });

        window.triggerUploadTugas = function() { document.getElementById('fileTugas').click(); };
        window.handleUploadTugas = function(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                let updatedCount = 0;
                json.forEach(row => {
                    const rowNik = String(row['NIK'] || '').trim();
                    const rowNama = String(row['NAMA PEGAWAI'] || row['NAMA_PEGAWAI'] || row['NAMA'] || '').trim();
                    let g = window.DB.guru.find(x => (rowNik && String(x.nik).trim() === rowNik) || (rowNama && x.nama.toLowerCase() === rowNama.toLowerCase()));
                    if (g) {
                        TUGAS_COLUMNS_CONFIG.forEach(col => {
                            if (col.key === 'no' || col.key === 'nik' || col.key === 'nama') return;
                            if (row[col.header] !== undefined) {
                                g[col.key] = row[col.header];
                            } else if (col.alt) {
                                for (const altKey of col.alt) {
                                    if (row[altKey] !== undefined) { g[col.key] = row[altKey]; break; }
                                }
                            }
                        });
                        updatedCount++;
                    }
                });
                window.logActivity('Import Excel Tugas Pegawai', updatedCount + ' Pegawai', 'Tugas Pegawai', 'blue');
                window.render();
                document.getElementById('fileTugas').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });
                if (json.length === 0) {
                    window.showToast('File Excel kosong!', 'alert-circle', 'text-orange-500');
                    return;
                }
                const importedSiswa = json.map((row, i) => {
                    let s = { id: i + 1, status: true };
                    SISWA_COLUMNS_CONFIG.forEach(col => {
                        const val = row[col.header] !== undefined ? row[col.header] : (row[col.key] !== undefined ? row[col.key] : '');
                        s[col.key] = val;
                    });
                    if (!s.no) s.no = String(i + 1);
                    return s;
                });
                window.DB.siswa = importedSiswa;
                window.logActivity('Import Excel', importedSiswa.length + ' Baris', 'Siswa', 'teal');
                window.render();
                document.getElementById('fileSiswa').value = '';

            reader.readAsArrayBuffer(file);

                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#cbd5e1]">NPSN SEKOLAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#cbd5e1]">PROVINSI SEKOLAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#cbd5e1]">KAB. SEKOLAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#cbd5e1]">KEC. SEKOLAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">NAMA AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">NIK AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">TAHUN LAHIR AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENDIDIKAN AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PEKERJAAN AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENGHASILAN AYAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">NAMA IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">NIK IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">TAHUN LAHIR IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENDIDIKAN IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PEKERJAAN IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENGHASILAN IBU</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">ALAMAT ORANG TUA</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#e9d5ff]">NAMA WALI</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#e9d5ff]">PEKERJAAN WALI</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#e9d5ff]">ALAMAT WALI</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">NO. WHATSAPP</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#a7f3d0]">LINK KK</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#a7f3d0]">LINK IJAZAH</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#f1f5f9]">STATUS AKTIF</th>
                                    <th class="py-3 px-4 text-[10px] font-extrabold text-brand-navy uppercase text-right whitespace-nowrap sticky-action-header">AKSI</th>
                                </tr>
                            </thead>
                            <tbody>${trs}</tbody>
                        </table>
                        ${filteredSiswa.length === 0 ? '<div class="p-8 text-center text-brand-muted text-[12px] font-bold">Tidak ada data siswa ditemukan.</div>' : ''}
                    </div>
                </div>
            </div>`;
        };

        window.renderAdminLogs = function() {
            const rows = window.DB.logs.map(l => `<div class="flex items-start gap-3.5 p-3.5 border-b border-white/30 hover:bg-white/30 transition-colors"><div class="w-9 h-9 rounded-full bg-${l.color}-100 flex items-center justify-center border border-white shrink-0"><i data-lucide="activity" class="w-4 h-4 text-${l.color}-500"></i></div><div class="flex-1 min-w-0"><h4 class="text-[12px] font-bold text-brand-navy leading-tight">${l.action} <span class="text-brand-blue">${l.target}</span></h4><div class="flex items-center gap-2.5 mt-1"><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${l.user}</span><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${l.time}</span><span class="text-[9px] font-bold px-1.5 py-0.5 bg-white/60 border border-white rounded text-brand-muted ml-auto">${l.type}</span></div></div></div>`).join('');
            return `<div class="p-4 md:p-6 w-full h-full flex flex-col box-border animate-fade"><div class="glass-panel p-4 rounded-[20px] mb-5 shrink-0"><h1 class="text-[18px] font-extrabold text-brand-navy">Log Aktivitas</h1><p class="text-[11px] text-brand-muted mt-0.5">Riwayat tindakan penting di sistem.</p></div><div class="glass-panel rounded-[20px] flex-1 overflow-y-auto slider-scroll p-1 w-full">${rows}</div></div>`;
        };

        window.render = function() {
            const root = document.getElementById('app-root'); const isMobile = window.innerWidth < 768; const isAdminView = window.state.path.startsWith('#admin');
            if (isAdminView && !['Super Admin', 'Admin'].includes(window.state.user.role)) { window.navigate('#home'); return; }
            if (isAdminView) {
                let adminContent = '';
                switch(window.state.path) {
                    case '#admin-dashboard': adminContent = window.renderAdminDashboard(); break; case '#admin-menu-apps': adminContent = window.renderAdminMenuApps(); break; case '#admin-users': adminContent = window.renderAdminUsers(); break;
                    case '#admin-guru': adminContent = window.renderAdminGuru(); break; case '#admin-tugas-pegawai': adminContent = window.renderAdminTugasPegawai(); break; case '#admin-siswa': adminContent = window.renderAdminSiswa(); break;
                    case '#admin-logs': adminContent = window.renderAdminLogs(); break; default: adminContent = window.renderAdminDashboard();
                }
                const existingShell = document.getElementById('admin-shell-layout');
                if (existingShell && existingShell.dataset.mobile === String(isMobile)) {
                    document.getElementById('admin-main-content').innerHTML = adminContent;
                    if (!isMobile) { const sidebarLinks = document.getElementById('admin-sidebar-links'); if (sidebarLinks) sidebarLinks.innerHTML = window.getAdminSidebarLinks(); } else { const mobileLinks = document.getElementById('admin-mobile-links'); if (mobileLinks) mobileLinks.innerHTML = window.getAdminMobileNavLinks(); }
                } else {
                    root.innerHTML = `<div id="admin-shell-layout" data-mobile="${isMobile}" class="flex h-[100dvh] w-full overflow-hidden relative">${!isMobile ? `<aside class="w-[200px] shrink-0 bg-white/30 border-r border-white/50 backdrop-blur-3xl z-40 flex flex-col"><div class="h-[60px] flex items-center gap-3 px-4 border-b border-white/40"><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-[10px] flex items-center justify-center text-white shadow-sm"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></div><div class="flex flex-col"><span class="text-[14px] font-extrabold text-brand-navy leading-none">My Alka</span><span class="text-[9px] font-bold text-brand-blue uppercase tracking-wider mt-1">Admin Panel</span></div></div><nav id="admin-sidebar-links" class="flex flex-col gap-1.5 p-3">${window.getAdminSidebarLinks()}</nav></aside>` : ''}<div class="flex-1 flex flex-col h-full relative w-full overflow-hidden ${isMobile ? 'pb-[70px]' : ''}"><header class="h-[56px] md:h-[60px] flex items-center justify-between px-4 md:px-6 shrink-0 z-30 bg-white/20 backdrop-blur-md border-b border-white/40 w-full"><div class="font-bold text-brand-navy text-[14px] md:hidden">Admin Panel</div><div class="flex items-center gap-3 ml-auto relative"><button onclick="navigate('#home')" class="glass-pill px-3 py-1.5 rounded-full text-[11px] font-bold text-brand-navy flex items-center gap-1.5 hover:bg-white shadow-sm mr-1"><i data-lucide="monitor" class="w-3.5 h-3.5"></i> Lihat Portal</button><div class="w-7 h-7 rounded-full border border-white shadow-sm bg-blue-100 overflow-hidden"><img src="https://i.pravatar.cc/150?img=32" class="w-full h-full object-cover"></div><span class="text-[11px] font-bold text-brand-navy hidden md:block">${window.state.user.name}</span></div></header><main id="admin-main-content" class="flex-1 overflow-hidden relative w-full">${adminContent}</main></div>${isMobile ? `<nav id="admin-mobile-links" class="bottom-nav border-t border-white/80 bg-white/80">${window.getAdminMobileNavLinks()}</nav>` : ''}</div>`;
                }
            } else { root.innerHTML = window.renderPortalLayout(isMobile); }
            setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 10); window.renderNotifItems();
        };

        window.addEventListener('resize', () => { const isMobile = window.innerWidth < 768; const existingShell = document.getElementById('admin-shell-layout'); if (existingShell && existingShell.dataset.mobile !== String(isMobile)) window.render(); });
        
        window.initSmartPWA();
        initCloud();
    </script>
</body>
</html>
