    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#2878F0', navy: '#0f172a', muted: '#64748b' } }
                }
            }

    <style>
        :root {
            --shadow-glass: 0 10px 40px -10px rgba(0,0,0,0.08);
            --inset-glass: inset 0 1px 0 rgba(255,255,255,0.8), inset 1px 0 0 rgba(255,255,255,0.3);
        }

        body {
            font-family: 'Inter', sans-serif; color: theme('colors.brand.navy');
            background-color: #f8fafc;
            background-image: radial-gradient(ellipse at 0% 0%, #cde8fb 0%, transparent 60%), radial-gradient(ellipse at 100% 0%, #ffe0cc 0%, transparent 60%), radial-gradient(ellipse at 100% 100%, #fff5e6 0%, transparent 60%), radial-gradient(ellipse at 0% 100%, #dcf0ff 0%, transparent 60%);
            background-attachment: fixed; min-height: 100vh; min-height: 100dvh;
            overflow: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* WATER GLASS EFFECT */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.9); border-left: 1.5px solid rgba(255, 255, 255, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-glass), var(--inset-glass);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .glass-popup { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-popup.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        .slider-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .slider-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        /* Full Width Bottom Nav */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: theme('colors.brand.muted'); font-size: 11px; font-weight: 600; flex: 1; height: 100%; position: relative; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item.active { color: theme('colors.brand.blue'); }
        .nav-item.active i { transform: translateY(-2px) scale(1.15); stroke-width: 2.5px; }
        .nav-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; border-radius: 0 0 4px 4px; background-color: theme('colors.brand.blue'); opacity: 0; transition: opacity 0.3s; }
        .nav-item.active .nav-indicator { opacity: 1; }

        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Form Controls */
        .input-glass { background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.8); border-radius: 8px; padding: 6px 10px; width: 100%; outline: none; transition: all 0.2s; font-size: 12px; color: #0f172a; }
        .input-glass:focus { border-color: #3b82f6; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        
        /* Modal Overlay */
        #modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.2); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px; }
        #modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { animation: modalZoom 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
        @keyframes modalZoom { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Toast */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-size: 13px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Drag & Drop Styles */
        .draggable-row { transition: background-color 0.2s; }
        .draggable-row.dragging { opacity: 0.4; background: rgba(59, 130, 246, 0.1); }
        .draggable-row.drag-over { border-top: 2px solid #3b82f6; }
        .grip-handle { cursor: grab; user-select: none; }
        .grip-handle:active { cursor: grabbing; }
    </style>
</head>

    <script>
        // ==========================================

        const NOTIFICATIONS = [

            editingAppId: null

        const AVAILABLE_COLORS = [
            { id: 'blue', text: 'text-blue-500', bg: 'bg-blue-100' },
            { id: 'purple', text: 'text-purple-500', bg: 'bg-purple-100' },
            { id: 'green', text: 'text-green-500', bg: 'bg-green-100' },
            { id: 'teal', text: 'text-teal-500', bg: 'bg-teal-100' },
            { id: 'yellow', text: 'text-yellow-500', bg: 'bg-yellow-100' },
            { id: 'orange', text: 'text-orange-500', bg: 'bg-orange-100' },
            { id: 'pink', text: 'text-pink-500', bg: 'bg-pink-100' }
        ];

        // ==========================================
        // 3. INISIALISASI & SINKRONISASI SUPABASE
        // ==========================================
        async function initCloud() {
            if (!supabaseClient) {
                window.render();
                return;
            }
            try {
                // Tarik data awal dari Supabase
                const { data, error } = await supabaseClient
                    .from('portal_state')
                    .select('data')
                    .eq('id', 1)
                    .single();
                
                if (error) {
                    console.log("Supabase error (mungkin belum disetup), pakai data default lokal.");
                } else if (data && data.data && Object.keys(data.data).length > 0) {
                    // Terapkan data dari cloud ke memori
                    const cloudDB = data.data;
                    if (cloudDB.menus) window.DB.menus = cloudDB.menus;
                    if (cloudDB.apps) window.DB.apps = cloudDB.apps;
                    if (cloudDB.users) window.DB.users = cloudDB.users;
                    if (cloudDB.logs) window.DB.logs = cloudDB.logs;
                }
                
                window.render();

                // Setup Realtime Listener - Jika ada perubahan dari perangkat lain, otomatis update!
                supabaseClient.channel('custom-all-channel')
                    .on(
                        'postgres_changes',
                        { event: '*', schema: 'public', table: 'portal_state' },
                        (payload) => {
                            const newData = payload.new.data;
                            if (newData) {
                                if (newData.menus) window.DB.menus = newData.menus;
                                if (newData.apps) window.DB.apps = newData.apps;
                                if (newData.users) window.DB.users = newData.users;
                                if (newData.logs) window.DB.logs = newData.logs;
                                window.render(); // Render ulang dengan halus tanpa kedip
                            }
                        }
                    )
                    .subscribe();

            } catch (err) {
                console.error("Gagal terhubung ke Cloud, berjalan di mode lokal:", err);
                window.render();
            }
        }

        window.globalSave = async function() {
            if (!supabaseClient) {
                window.showToast('Data disimpan sementara (Masukkan URL Supabase agar permanen)', 'info', 'text-orange-500');
                window.render();
                return;
            }
            window.showToast('Menyimpan perubahan ke Supabase...', 'cloud-upload', 'text-blue-500');
            try {
                // Bungkus semua pengaturan yang mau disimpan
                const dataToSave = {
                    menus: window.DB.menus,
                    apps: window.DB.apps,
                    users: window.DB.users,
                    logs: window.DB.logs
                };

                // Lempar ke Supabase
                const { error } = await supabaseClient
                    .from('portal_state')
                    .update({ data: dataToSave })
                    .eq('id', 1);

                if (error) throw error;
                window.showToast('Semua pengaturan berhasil tersimpan permanen!', 'cloud-check', 'text-green-500');
            } catch(e) {
                console.error("Gagal simpan ke Supabase:", e);
                window.showToast('Gagal terhubung ke Cloud!', 'x-circle', 'text-red-500');
            }
            window.render();
        }

        window.showToast = function(msg, icon = 'check-circle', color = 'text-green-500') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i> ${msg}`;
            container.appendChild(toast);
            if (window.lucide) lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.logActivity = function(action, target, type, color = 'blue') {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            window.DB.logs.unshift({ time: timeStr, user: window.state.user.name, action, target, type, color });
            if(window.DB.logs.length > 50) window.DB.logs.pop(); 
            // Auto save log ke cloud
            window.globalSave();
        }

        window.openModal = function(htmlContent) {
            const overlay = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            body.innerHTML = htmlContent;
            overlay.classList.add('show');
            if (window.lucide) lucide.createIcons();
        }

        window.closeModal = function(e) {
            if(e && e.target.id !== 'modal-overlay' && e.type === 'click') return; 
            document.getElementById('modal-overlay').classList.remove('show');
        }

        // ==========================================
        // DRAG & DROP HANDLERS (NATIVE HTML5)
        // ==========================================
        let dragSrcEl = null;
        let dragType = null;
        let dragId = null;

        window.handleDragStart = function(e, id, type) {
            dragSrcEl = e.target.closest('.draggable-row');
            dragType = type;
            dragId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id);
            dragSrcEl.classList.add('dragging');
        }

        window.handleDragOver = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const tr = e.target.closest('.draggable-row');
            if (tr && tr !== dragSrcEl) {
                tr.classList.add('drag-over');
            }
            return false;
        }

        window.handleDragLeave = function(e) {
            const tr = e.target.closest('.draggable-row');
            if (tr) tr.classList.remove('drag-over');
        }

        window.handleDrop = function(e, targetId, type) {
            e.stopPropagation();
            const tr = e.target.closest('.draggable-row');
            if (tr) tr.classList.remove('drag-over');

            if (dragSrcEl && dragType === type && dragId !== targetId) {
                let arr = (type === 'menu') ? window.DB.menus : window.DB.apps;
                const fromIdx = arr.findIndex(item => item.id == dragId);
                const toIdx = arr.findIndex(item => item.id == targetId);

                if (fromIdx !== -1 && toIdx !== -1) {
                    const [movedItem] = arr.splice(fromIdx, 1);
                    arr.splice(toIdx, 0, movedItem);

                    if (type === 'menu') {
                        arr.forEach((m, idx) => m.order = idx + 1);
                    }

                    window.logActivity(`Mengubah urutan ${type === 'menu' ? 'Menu' : 'Aplikasi'}`, movedItem.name, 'Sistem', 'blue');
                    window.render();
                    window.globalSave(); // Auto save struktur ke Cloud
                }
            }
            return false;
        }

        window.handleDragEnd = function(e) {
            if (dragSrcEl) dragSrcEl.classList.remove('dragging');
            document.querySelectorAll('.draggable-row').forEach(el => el.classList.remove('drag-over'));
        }

        window.enableDrag = function(btn) { btn.closest('.draggable-row').setAttribute('draggable', 'true'); }
        window.disableDrag = function(btn) { btn.closest('.draggable-row').setAttribute('draggable', 'false'); }


        // ==========================================
        // INLINE EDITING LOGIC
        // ==========================================
        window.startEditMenu = function(id) { window.state.editingMenuId = id; window.render(); }
        window.cancelEditMenu = function() { window.state.editingMenuId = null; window.render(); }
        
        window.saveMenuInline = function(id) {
            const menu = window.DB.menus.find(m => m.id === id);
            if (menu) {
                menu.name = document.getElementById(`editMenuName-${id}`).value;
                menu.icon = document.getElementById(`editMenuIcon-${id}`).value;
                if (menu.type === 'iframe') {
                    menu.url = document.getElementById(`editMenuUrl-${id}`).value;
                }
                window.logActivity('Mengubah detail menu', menu.name, 'Menu Portal', 'blue');
                window.showToast('Menu berhasil diperbarui!');
            }
            window.state.editingMenuId = null;
            window.render();
            window.globalSave();
        }

        window.toggleMenuVisibility = function(id) {
            const menu = window.DB.menus.find(m => m.id === id);
            if (menu) {
                menu.visible = !menu.visible;
                window.logActivity(`Mengubah visibilitas menu`, menu.name, 'Menu Portal', 'orange');
                window.showToast(`Menu ${menu.name} ${menu.visible ? 'ditampilkan' : 'disembunyikan'}.`);
                window.render();
                window.globalSave();
            }
        }

        window.startEditApp = function(id) { window.state.editingAppId = id; window.render(); }
        window.cancelEditApp = function() { window.state.editingAppId = null; window.render(); }

        window.toggleUmumInline = function(id) {
            const isUmum = document.getElementById(`editAppRole-Umum-${id}`).checked;
            const cbPegawai = document.getElementById(`editAppRole-Pegawai-${id}`);
            const cbWarid = document.getElementById(`editAppRole-Warid-${id}`);
            if (isUmum) {
                cbPegawai.checked = false; cbPegawai.disabled = true;
                cbWarid.checked = false; cbWarid.disabled = true;
            } else {
                cbPegawai.disabled = false; cbWarid.disabled = false;
            }
        }

        window.saveAppInline = function(id) {
            const app = window.DB.apps.find(a => a.id === id);
            if (app) {
                app.name = document.getElementById(`editAppName-${id}`).value;
                app.icon = document.getElementById(`editAppIcon-${id}`).value;
                app.url = document.getElementById(`editAppUrl-${id}`).value;
                app.section = document.getElementById(`editAppSection-${id}`).value;
                
                const colorVal = document.getElementById(`editAppColor-${id}`).value;
                const foundColor = AVAILABLE_COLORS.find(c => c.id === colorVal);
                if(foundColor) { app.color = foundColor.text; app.bg = foundColor.bg; }

                let newRoles = []; 
                if (document.getElementById(`editAppRole-Umum-${id}`).checked) {
                    newRoles.push('Umum');
                } else {
                    if (document.getElementById(`editAppRole-Pegawai-${id}`).checked) newRoles.push('Pegawai');
                    if (document.getElementById(`editAppRole-Warid-${id}`).checked) newRoles.push('Warid');
                }
                app.roles = newRoles;

                window.logActivity('Mengubah detail aplikasi', app.name, 'Aplikasi', 'blue');
                window.showToast('Aplikasi berhasil diperbarui!');
            }
            window.state.editingAppId = null;
            window.render();
            window.globalSave();
        }

        window.toggleAppStatus = function(id) {
            const app = window.DB.apps.find(a => a.id === id);
            if (app) {
                app.status = !app.status;
                window.logActivity(`${app.status ? 'Mengaktifkan' : 'Menonaktifkan'} aplikasi`, app.name, 'Aplikasi', app.status ? 'green' : 'red');
                window.showToast(`Aplikasi ${app.name} ${app.status ? 'diaktifkan' : 'dinonaktifkan'}.`);
                window.render();
                window.globalSave();
            }
        }

        window.toggleUserStatus = function(id) {
            const user = window.DB.users.find(u => u.id === id);
            if (user && user.id !== window.state.user.id) {
                user.status = !user.status;
                window.logActivity(`${user.status ? 'Mengaktifkan' : 'Menonaktifkan'} pengguna`, user.name, 'Pengguna', user.status ? 'green' : 'red');
                window.showToast(`Akun ${user.name} ${user.status ? 'diaktifkan' : 'dinonaktifkan'}.`);
                window.render();
                window.globalSave();
            }
        }

        window.showAddUserModal = function() {
            const roles = ['Super Admin', 'Admin', 'Pegawai', 'Warid'];
            const roleOptions = roles.map(r => `<option value="${r}">${r}</option>`).join('');
            const html = `
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-brand-navy mb-1">Tambah Pengguna</h2>
                </div>
                <form onsubmit="saveNewUser(event)" class="flex flex-col gap-3">
                    <input type="text" id="userName" required placeholder="Nama Lengkap" class="input-glass">
                    <select id="userRole" class="input-glass">${roleOptions}</select>

        window.navigate = function(hash) {

            if(window.location.hash !== window.state.path) {
                window.state.path = window.location.hash || '#home';
                window.render();

        window.togglePopup = function(id, e) {
            if(e) e.stopPropagation();

                el.classList.toggle('show');
                if(id.startsWith('notif')) window.renderNotifItems();

        window.switchNotifTab = function(tab, e) {
            if(e) e.stopPropagation();

        window.closeAllPopups = function() {
            document.querySelectorAll('.glass-popup').forEach(el => el.classList.remove('show'));
            const search = document.getElementById('search-dropdown');
            if(search) search.classList.add('hidden');
        }
        document.addEventListener('click', window.closeAllPopups);

        window.doSearch = function(query) {
            const dropdown = document.getElementById('search-dropdown');
            const resultsContainer = document.getElementById('search-results-list');
            if (!query || query.trim() === '') { dropdown.classList.add('hidden'); return; }
            dropdown.classList.remove('hidden');
            const q = query.toLowerCase();
            const results = window.DB.apps.filter(a => a.status && (a.roles.includes('Umum') || a.roles.includes(window.state.user.role)) && (a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)));

                resultsContainer.innerHTML = `<div class="p-4 text-center text-[12px] text-brand-muted">Tidak ada hasil.</div>`;

            let html = '';
            results.forEach(app => {
                html += `<div onclick="navigate('#app-${app.id}')" class="p-3 hover:bg-white/60 cursor-pointer flex items-center gap-3 border-b border-white/20 last:border-0"><div class="w-8 h-8 rounded-lg ${app.bg} flex items-center justify-center shrink-0 border border-white"><i data-lucide="${app.icon}" class="w-4 h-4 ${app.color}"></i></div><div><p class="text-[13px] font-bold text-brand-navy mb-0.5">${app.name}</p><p class="text-[10px] text-brand-muted">${app.cat}</p></div></div>`;

        window.changeZoom = function(delta) {

        window.renderNotifItems = function() {

            else { filtered.forEach(n => { html += `<div onclick="navigate('${n.target}')" class="p-2.5 hover:bg-white/60 rounded-xl cursor-pointer flex gap-3 border border-transparent hover:border-white/50 relative">${!n.read ? '<span class="absolute top-3 right-3 w-2 h-2 bg-blue-500 rounded-full"></span>' : ''}<div class="w-9 h-9 rounded-full ${n.bg} flex shrink-0 items-center justify-center border border-white"><i data-lucide="${n.icon}" class="w-[18px] h-[18px] ${n.color}"></i></div><div class="flex-1 min-w-0 pr-4"><p class="text-[12px] font-bold text-brand-navy mb-0.5">${n.title}</p><p class="text-[10px] text-brand-muted line-clamp-2">${n.desc}</p></div></div>`; }); }

        window.getNotifPopupHtml = function(idSuffix) {

            return `<div id="notif-popup${idSuffix}" onclick="event.stopPropagation()" class="glass-popup absolute ${idSuffix === '-mobile' ? 'right-0 top-[calc(100%+8px)]' : 'right-0 top-[calc(100%+12px)]'} w-[280px] glass-panel rounded-[24px] flex flex-col shadow-2xl origin-top-right z-50 overflow-hidden border border-white/60"><div class="px-4 py-3 border-b border-white/40 flex justify-between items-center bg-white/30"><span class="font-extrabold text-[13px] text-brand-navy">Notifikasi</span>${unreadCount > 0 ? `<span class="text-[9px] font-bold bg-blue-500 text-white px-2 py-0.5 rounded-full shadow-sm">${unreadCount} Baru</span>` : ''}</div><div class="flex border-b border-white/30 bg-white/40 p-1"><button id="tab-semua" onclick="switchNotifTab('semua', event)" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg bg-white shadow-sm text-brand-blue">Semua</button><button id="tab-belum" onclick="switchNotifTab('belum_dibaca', event)" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg text-brand-muted hover:text-brand-navy">Belum Dibaca</button></div><div id="notif-items-container" class="p-2 flex flex-col gap-1 max-h-[280px] overflow-y-auto slider-scroll bg-white/20"></div></div>`;

        }

        window.renderNativeViews = function(path) {
            if (path === '#login') {
                return `<div class="w-full h-full flex items-center justify-center p-5 relative animate-fade"><div class="glass-panel w-full max-w-[360px] p-8 rounded-[32px] flex flex-col items-center text-center relative z-10"><div class="mb-6 scale-110">${logoLargeSvg}</div><h2 class="text-[22px] font-extrabold text-brand-navy mb-2 tracking-tight">Selamat Datang</h2><p class="text-[13px] text-brand-muted mb-8 font-medium">Silakan masuk menggunakan akun My Alka Anda.</p><div class="w-full flex flex-col gap-3 mb-6"><input type="text" placeholder="NIS / NIK / Email" class="w-full bg-white/50 border border-white focus:border-blue-400 outline-none rounded-2xl px-4 py-3 text-[13px] font-medium text-brand-navy shadow-sm transition-all"><input type="password" placeholder="Kata Sandi" class="w-full bg-white/50 border border-white focus:border-blue-400 outline-none rounded-2xl px-4 py-3 text-[13px] font-medium text-brand-navy shadow-sm transition-all"></div><button onclick="doLogin()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold text-[14px] py-3.5 rounded-2xl shadow-lg transition-all">Masuk Sekarang</button></div></div>`;
            }

ss="w-12 h-12 rounded-[16px] bg-orange-100 flex items-center justify-center shrink-0 border border-white"><i data-lucide="lightbulb" class="w-6 h-6 text-orange-500"></i></div><div class="flex-1"><h3 class="text-[14px] font-bold text-brand-navy mb-0.5">Jelajahi Edukasi</h3><p class="text-[11px] text-brand-muted leading-tight">Temukan berbagai game & karya siswa.</p></div><div class="w-8 h-8 rounded-full bg-white/70 flex items-center justify-center text-brand-muted shrink-0 border border-white"><i data-lucide="chevron-right" class="w-4 h-4"></i></div></div></div><h2 class="text-[16px] font-extrabold text-brand-navy mb-3 ml-2">${path === '#edukasi' ? 'Semua Karya Edukasi' : 'Semua Aplikasi Utama'}</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">${appGridHTML}</div></div>`;

        window.renderPortalLayout = function(isMobile) {

            const isDirectApp = window.state.path.startsWith('#app-');
            
            let isIframe = false;
            let iframeUrl = null;
            let currentTitle = 'Portal';
            let activeAppObj = null;

            if (activeMenu && activeMenu.type === 'iframe') {
                isIframe = true;
                iframeUrl = activeMenu.url;
                currentTitle = activeMenu.name;
            } else if (isDirectApp) {
                const app = window.DB.apps.find(a => '#app-'+a.id === window.state.path && a.status);
                if (app) {
                    isIframe = true;
                    iframeUrl = app.url;
                    currentTitle = app.name;
                    activeAppObj = app;
                }
            }

            let currentSection = 'apps';
            if (window.state.path === '#edukasi' || (activeAppObj && activeAppObj.section === 'edukasi')) {
                currentSection = 'edukasi';

            const isAppView = window.state.path === '#apps' || window.state.path === '#edukasi' || isDirectApp;
            const userName = window.state.isLoggedIn ? window.state.user.name : 'Pengguna';
            
            const visibleMenus = window.DB.menus.filter(m => m.visible).sort((a,b) => a.order - b.order);
            const visibleApps = window.DB.apps.filter(a => a.status && (!window.state.isLoggedIn || a.roles.includes('Umum') || a.roles.includes(window.state.user.role)) && a.section === currentSection);

            let sidebarNav = visibleMenus.map(m => {
                const isActiveMenu = window.state.path === m.hash || (m.hash === '#apps' && isAppView && currentSection === 'apps') || (m.hash === '#edukasi' && isAppView && currentSection === 'edukasi');
                return `<a onclick="navigate('${m.hash}')" class="flex items-center gap-3 px-3 py-2.5 rounded-[12px] font-semibold text-[13px] transition-all cursor-pointer ${isActiveMenu ? 'bg-white shadow-sm text-brand-blue border border-white/60' : 'text-brand-muted hover:bg-white/40'}"><i data-lucide="${m.icon}" class="w-4 h-4"></i> ${m.name}</a>`;
            }).join('');
            
            let appListHTML = '';
            [...new Set(visibleApps.map(a => a.cat))].forEach(cat => {

            let bottomNavHtml = visibleMenus.map(m => {

            return `

                <div class="flex-1 flex flex-col h-full overflow-hidden relative w-full ${isMobile && !isDirectApp && window.state.path !== '#login' ? 'pb-[70px]' : ''}">

                                        <th class="py-2.5 px-3 text-[10px] font-bold text-brand-muted uppercase">Nama Menu</th>
                                        <th class="py-2.5 px-3 text-[10px] font-bold text-brand-muted uppercase">Ikon</th>
                                        <th class="py-2.5 px-3 text-[10px] font-bold text-brand-muted uppercase min-w-[200px]">Tautan (URL)</th>
                                        <th class="py-2.5 px-3 text-[10px] font-bold text-brand-muted uppercase w-[80px]">Tampil</th>
                                        <th class="py-2.5 px-3 text-[10px] font-bold text-brand-muted uppercase text-right w-[70px]">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsMenu}</tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row md:items-center justify-between mb-2 mx-2 gap-3 shrink-0 mt-2">
                    <h2 class="text-[14px] font-extrabold text-brand-navy flex items-center gap-2"><i data-lucide="layers" class="w-4 h-4 text-brand-blue"></i> Tabel Daftar Aplikasi Utama</h2>
                    <div class="flex items-center gap-3">
                        <div class="relative w-full md:w-[200px]">
                            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-brand-muted"></i>
                            <input type="text" oninput="triggerAppSearch(this.value)" placeholder="Cari aplikasi..." value="${window.state.searchQueryApp}" class="input-glass pl-8 py-1.5">
                        </div>
                        <button onclick="showToast('Fitur Tambah segera hadir')" class="bg-blue-500 hover:bg-blue-600 text-white text-[12px] font-bold px-4 py-2 rounded-xl shadow-md flex items-center justify-center gap-1.5 shrink-0"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah</button>
                    </div>
                </div>
                
                <div class="glass-panel rounded-[20px] overflow-hidden flex flex-col shrink-0 mb-6 w-full">
                    <div class="overflow-x-auto slider-scroll w-full">
                        <table class="w-full text-left border-collapse min-w-[1050px]">
                            ${theadTemplate}
                            <tbody>${trsApps}</tbody>
                        </table>
                        ${filteredApps.filter(a => a.section === 'apps').length === 0 ? '<div class="p-8 text-center text-brand-muted text-[12px] font-bold">Tidak ada aplikasi utama ditemukan.</div>' : ''}
                    </div>
                </div>
                
                <h2 class="text-[14px] font-extrabold text-brand-navy mb-2 mx-2 flex items-center gap-2 shrink-0 mt-2"><i data-lucide="lightbulb" class="w-4 h-4 text-orange-500"></i> Tabel Daftar Karya & Edukasi</h2>
                
                <div class="glass-panel rounded-[20px] overflow-hidden flex flex-col shrink-0 mb-8 w-full">
                    <div class="overflow-x-auto slider-scroll w-full">
                        <table class="w-full text-left border-collapse min-w-[1050px]">
                            ${theadTemplate}
                            <tbody>${trsEdukasi}</tbody>
                        </table>
                        ${filteredApps.filter(a => a.section === 'edukasi').length === 0 ? '<div class="p-8 text-center text-brand-muted text-[12px] font-bold">Tidak ada karya/edukasi ditemukan.</div>' : ''}
                    </div>
                </div>
                
            </div>`;
        }

        window.triggerUserSearch = function(val) { window.state.searchQueryUser = val.toLowerCase(); window.render(); }
        
        window.renderAdminUsers = function() {
            const filteredUsers = window.DB.users.filter(u => u.name.toLowerCase().includes(window.state.searchQueryUser) || u.role.toLowerCase().includes(window.state.searchQueryUser));
            const trs = filteredUsers.map(u => `<tr class="border-b border-white/30 hover:bg-white/30 transition-colors"><td class="py-3 px-4"><div class="flex items-center gap-3"><img src="https://i.pravatar.cc/150?u=${u.id}" class="w-9 h-9 rounded-full border-2 border-white shadow-sm"><div><div class="font-bold text-[13px] text-brand-navy">${u.name}</div><div class="text-[10px] text-brand-muted">${u.email}</div></div></div></td><td class="py-3 px-4 hidden md:table-cell"><span class="text-[11px] font-bold px-2.5 py-1 ${u.role === 'Super Admin' ? 'bg-orange-100 text-orange-600' : 'bg-blue-50 text-blue-600'} rounded-md border border-white/50">${u.role}</span></td><td class="py-3 px-4 hidden lg:table-cell"><div class="flex items-center gap-1.5"><div class="w-2 h-2 rounded-full ${u.status ? 'bg-green-500' : 'bg-red-500'}"></div><span class="text-[12px] font-bold text-brand-navy">${u.status ? 'Aktif' : 'Nonaktif'}</span></div></td><td class="py-3 px-4 text-right"><div class="flex items-center justify-end gap-2"><button onclick="toggleUserStatus(${u.id})" class="w-7 h-7 rounded-lg bg-white/60 hover:bg-white flex items-center justify-center text-brand-muted border border-white shadow-sm" title="${u.status ? 'Nonaktifkan' : 'Aktifkan'}"><i data-lucide="${u.status ? 'ban' : 'check-circle'}" class="w-3.5 h-3.5 ${u.status ? 'text-red-500' : 'text-green-500'}"></i></button><button class="w-7 h-7 rounded-lg bg-white/60 hover:bg-white flex items-center justify-center text-brand-blue border border-white shadow-sm" onclick="showEditUserModal(${u.id})"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button></div></td></tr>`).join('');
            return `<div class="p-4 md:p-6 w-full h-full flex flex-col box-border"><div class="glass-panel p-4 rounded-[20px] flex flex-col md:flex-row md:items-center justify-between mb-5 gap-3"><div><h1 class="text-[18px] font-extrabold text-brand-navy">Data Pengguna</h1><p class="text-[11px] text-brand-muted mt-0.5">Kelola akun dan role.</p></div><div class="flex items-center gap-3"><div class="relative w-full max-w-[200px]"><i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-brand-muted"></i><input type="text" oninput="triggerUserSearch(this.value)" placeholder="Cari pengguna..." value="${window.state.searchQueryUser}" class="input-glass pl-8 py-1.5"></div><button onclick="showAddUserModal()" class="bg-blue-500 hover:bg-blue-600 text-white text-[12px] font-bold px-4 py-2 rounded-xl shadow-md flex items-center justify-center gap-1.5"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Tambah</button></div></div><div class="glass-panel rounded-[20px] flex-1 overflow-hidden flex flex-col w-full"><div class="overflow-y-auto slider-scroll flex-1 w-full"><table class="w-full text-left border-collapse min-w-[500px]"><thead class="bg-white/40 sticky top-0 backdrop-blur-md z-10"><tr><th class="py-2.5 px-4 text-[10px] font-bold text-brand-muted uppercase">Pengguna</th><th class="py-2.5 px-4 text-[10px] font-bold text-brand-muted uppercase hidden md:table-cell">Role</th><th class="py-2.5 px-4 text-[10px] font-bold text-brand-muted uppercase hidden lg:table-cell">Status</th><th class="py-2.5 px-4 text-[10px] font-bold text-brand-muted uppercase text-right">Aksi</th></tr></thead><tbody>${trs}</tbody></table>${filteredUsers.length === 0 ? '<div class="p-8 text-center text-brand-muted text-[12px] font-bold">Tidak ada pengguna ditemukan.</div>' : ''}</div></div></div>`;
        }

        window.renderAdminLogs = function() {
            const rows = window.DB.logs.map(l => `<div class="flex items-start gap-3.5 p-3.5 border-b border-white/30 hover:bg-white/30 transition-colors"><div class="w-9 h-9 rounded-full bg-${l.color}-100 flex items-center justify-center border border-white shrink-0"><i data-lucide="activity" class="w-4 h-4 text-${l.color}-500"></i></div><div class="flex-1 min-w-0"><h4 class="text-[12px] font-bold text-brand-navy leading-tight">${l.action} <span class="text-brand-blue">${l.target}</span></h4><div class="flex items-center gap-2.5 mt-1"><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${l.user}</span><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${l.time}</span><span class="text-[9px] font-bold px-1.5 py-0.5 bg-white/60 border border-white rounded text-brand-muted ml-auto">${l.type}</span></div></div></div>`).join('');
            return `<div class="p-4 md:p-6 w-full h-full flex flex-col box-border"><div class="glass-panel p-4 rounded-[20px] mb-5 shrink-0"><h1 class="text-[18px] font-extrabold text-brand-navy">Log Aktivitas</h1><p class="text-[11px] text-brand-muted mt-0.5">Riwayat tindakan penting di sistem.</p></div><div class="glass-panel rounded-[20px] flex-1 overflow-y-auto slider-scroll p-1 w-full">${rows}</div></div>`;
        }

        // ==========================================
        // SMART RENDER ENGINE (Anti-Flicker)
        // ==========================================
        window.render = function() {
            const root = document.getElementById('app-root');
            const isMobile = window.innerWidth < 768;
            const isAdminView = window.state.path.startsWith('#admin');

            if (isAdminView && !['Super Admin', 'Admin'].includes(window.state.user.role)) { 
                window.navigate('#home'); 
                return; 
            }

            if (isAdminView) {
                let adminContent = '';
                switch(window.state.path) {
                    case '#admin-dashboard': adminContent = window.renderAdminDashboard(); break;
                    case '#admin-menu-apps': adminContent = window.renderAdminMenuApps(); break;
                    case '#admin-users': adminContent = window.renderAdminUsers(); break;
                    case '#admin-logs': adminContent = window.renderAdminLogs(); break;
                    default: adminContent = window.renderAdminDashboard();
                }

                const existingShell = document.getElementById('admin-shell-layout');
                if (existingShell && existingShell.dataset.mobile === String(isMobile)) {
                    // Update inner content tanpa me-render ulang seluruh halaman (bebas kedip)
                    document.getElementById('admin-main-content').innerHTML = adminContent;
                    if (!isMobile) {
                        const sidebarLinks = document.getElementById('admin-sidebar-links');
                        if (sidebarLinks) sidebarLinks.innerHTML = window.getAdminSidebarLinks();
                    } else {
                        const mobileLinks = document.getElementById('admin-mobile-links');
                        if (mobileLinks) mobileLinks.innerHTML = window.getAdminMobileNavLinks();
                    }
                } else {
                    // Buat shell dasar pertama kali (TANPA animasi fade yang bikin layar kedip putih)
                    root.innerHTML = `
                    <div id="admin-shell-layout" data-mobile="${isMobile}" class="flex h-[100dvh] w-full overflow-hidden relative">
                        ${!isMobile ? `<aside class="w-[200px] shrink-0 bg-white/30 border-r border-white/50 backdrop-blur-3xl z-40 flex flex-col"><div class="h-[60px] flex items-center gap-3 px-4 border-b border-white/40"><div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-[10px] flex items-center justify-center text-white shadow-sm"><i data-lucide="layout-dashboard" class="w-4 h-4"></i></div><div class="flex flex-col"><span class="text-[14px] font-extrabold text-brand-navy leading-none">My Alka</span><span class="text-[9px] font-bold text-brand-blue uppercase tracking-wider mt-1">Admin Panel</span></div></div><nav id="admin-sidebar-links" class="flex flex-col gap-1.5 p-3">${window.getAdminSidebarLinks()}</nav></aside>` : ''}
                        <div class="flex-1 flex flex-col h-full relative w-full overflow-hidden ${isMobile ? 'pb-[70px]' : ''}">
                            <header class="h-[56px] md:h-[60px] flex items-center justify-between px-4 md:px-6 shrink-0 z-30 bg-white/20 backdrop-blur-md border-b border-white/40 w-full">
                                <div class="font-bold text-brand-navy text-[14px] md:hidden">Admin Panel</div>
                                <div class="flex items-center gap-3 ml-auto relative"><button onclick="navigate('#home')" class="glass-pill px-3 py-1.5 rounded-full text-[11px] font-bold text-brand-navy flex items-center gap-1.5 hover:bg-white shadow-sm mr-1"><i data-lucide="monitor" class="w-3.5 h-3.5"></i> Lihat Portal</button><div class="w-7 h-7 rounded-full border border-white shadow-sm bg-blue-100 overflow-hidden"><img src="https://i.pravatar.cc/150?img=32" class="w-full h-full object-cover"></div><span class="text-[11px] font-bold text-brand-navy hidden md:block">${window.state.user.name}</span></div>
                            </header>
                            <main id="admin-main-content" class="flex-1 overflow-hidden relative w-full">${adminContent}</main>
                        </div>
                        ${isMobile ? `<nav id="admin-mobile-links" class="bottom-nav border-t border-white/80 bg-white/80">${window.getAdminMobileNavLinks()}</nav>` : ''}
                    </div>`;
                }
            } else {
                root.innerHTML = window.renderPortalLayout(isMobile);
            }
            
            setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 10);
            window.renderNotifItems();
        }
        
        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth < 768;
            const existingShell = document.getElementById('admin-shell-layout');
            if (existingShell && existingShell.dataset.mobile !== String(isMobile)) {
                window.render();
            }
        });
        
        // Memulai aplikasi dengan mengambil data dari Supabase
        initCloud();
    </script>
</body>
</html>
