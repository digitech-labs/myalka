        window.formatDateId = function(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            let parts = String(dateStr).split('-');
            if (parts.length !== 3) return dateStr;
            let day, month, year;
            if (parts[0].length === 4) { year = parts[0]; month = parts[1]; day = parts[2]; } else { day = parts[0]; month = parts[1]; year = parts[2]; } 
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            const mIndex = parseInt(month, 10) - 1;
            if (mIndex >= 0 && mIndex < 12) return `${parseInt(day, 10)} ${months[mIndex]} ${year}`;
            return dateStr;
        }

        async function initCloud() {
            if (!supabaseClient) { window.render(); return; }
            try {
                const [resGuru, resSiswa, resState] = await Promise.all([
                    supabaseClient.from('guru').select('*'),
                    supabaseClient.from('siswa').select('*'),
                    supabaseClient.from('portal_state').select('data').eq('id', 1).maybeSingle()
                ]);

                if (!resGuru.error && resGuru.data && resGuru.data.length > 0) {
                    window.DB.guru = resGuru.data;
                }
                if (!resSiswa.error && resSiswa.data && resSiswa.data.length > 0) {
                    window.DB.siswa = resSiswa.data;
                }
                if (!resState.error && resState.data && resState.data.data) {
                    const cDB = resState.data.data;
                    if (cDB.menus) window.DB.menus = cDB.menus;
                    if (cDB.apps) window.DB.apps = cDB.apps;
                    if (cDB.users) window.DB.users = cDB.users;
                    if (cDB.logs) window.DB.logs = cDB.logs;
                }
                window.render();
            } catch (err) {
                console.warn("Cloud init error:", err);
                window.render();
            }
        }

        window.globalSave = async function() {
            if (!supabaseClient) { window.showToast('Data disimpan lokal.', 'info', 'text-orange-500'); window.render(); return; }
            window.showToast('Menyimpan ke Supabase...', 'cloud-upload', 'text-blue-500');
            try {
                await supabaseClient.from('portal_state').upsert({ id: 1, data: { menus: window.DB.menus, apps: window.DB.apps, users: window.DB.users, logs: window.DB.logs } });

                if (window.DB.guru.length > 0) {
                    await supabaseClient.from('guru').upsert(window.DB.guru.map(g => ({ ...g, id: Number(g.id) })));
                }
                if (window.DB.siswa.length > 0) {
                    await supabaseClient.from('siswa').upsert(window.DB.siswa.map(s => ({ ...s, id: Number(s.id) })));
                }

                window.showToast('Tersimpan di Tabel Supabase!', 'cloud-check', 'text-green-500');
            } catch(e) {
                window.showToast('Gagal simpan Cloud: ' + (e.message || 'Cek koneksi tabel'), 'x-circle', 'text-red-500');
            }
            window.render();
        }

        window.showToast = function(msg, icon = 'check-circle', color = 'text-green-500') {
            const container = document.getElementById('toast-container'); 
            if(!container) return;
            const toast = document.createElement('div'); 
            toast.className = 'toast'; 
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 ${color}"></i> ${msg}`; 
            container.appendChild(toast); 
            if (window.lucide) lucide.createIcons();
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }
        window.logActivity = function(action, target, type, color = 'blue') { 
            const now = new Date(); 
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`; 
            window.DB.logs.unshift({ time: timeStr, user: window.state.user.name, action, target, type, color }); 
            if(window.DB.logs.length > 50) window.DB.logs.pop(); 
            if(supabaseClient) window.globalSave(); 
        }
        window.openModal = function(htmlContent) { 
            const overlay = document.getElementById('modal-overlay'); 
            const body = document.getElementById('modal-body'); 
            if(body) body.innerHTML = htmlContent; 
            if(overlay) overlay.classList.add('show'); 
            if (window.lucide) lucide.createIcons(); 
        }
        window.closeModal = function(e) { 
            if(e && e.target && e.target.id !== 'modal-overlay' && e.type === 'click') return; 
            const overlay = document.getElementById('modal-overlay');
            if(overlay) overlay.classList.remove('show'); 
        }

        let dragSrcEl = null; let dragType = null; let dragId = null;
        window.handleDragStart = function(e, id, type) { dragSrcEl = e.target.closest('.draggable-row'); dragType = type; dragId = id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', id); if(dragSrcEl) dragSrcEl.classList.add('dragging'); }
        window.handleDragOver = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; const tr = e.target.closest('.draggable-row'); if (tr && tr !== dragSrcEl) { tr.classList.add('drag-over'); } return false; }
        window.handleDragLeave = function(e) { const tr = e.target.closest('.draggable-row'); if (tr) tr.classList.remove('drag-over'); }
        window.handleDrop = function(e, targetId, type) { e.stopPropagation(); const tr = e.target.closest('.draggable-row'); if (tr) tr.classList.remove('drag-over'); if (dragSrcEl && dragType === type && dragId !== targetId) { let arr = (type === 'menu') ? window.DB.menus : window.DB.apps; const fromIdx = arr.findIndex(item => item.id == dragId); const toIdx = arr.findIndex(item => item.id == targetId); if (fromIdx !== -1 && toIdx !== -1) { const [movedItem] = arr.splice(fromIdx, 1); arr.splice(toIdx, 0, movedItem); if (type === 'menu') { arr.forEach((m, idx) => m.order = idx + 1); } window.logActivity(`Mengubah urutan ${type === 'menu' ? 'Menu' : 'Aplikasi'}`, movedItem.name, 'Sistem', 'blue'); window.render(); } } return false; }
        window.handleDragEnd = function(e) { if (dragSrcEl) dragSrcEl.classList.remove('dragging'); document.querySelectorAll('.draggable-row').forEach(el => el.classList.remove('drag-over')); }

        window.navigate = function(hash) { window.closeAllPopups(); window.location.hash = hash; window.state.path = hash; window.state.zoom = 1.0; window.render(); }
        window.addEventListener('hashchange', () => { if(window.location.hash !== window.state.path) { window.state.path = window.location.hash || '#home'; window.render(); } });
        window.togglePopup = function(id, e) { if(e) e.stopPropagation(); window.closeAllPopups(); const el = document.getElementById(id); if(el) { el.classList.toggle('show'); if(id.startsWith('notif')) window.renderNotifItems(); } }
        window.switchNotifTab = function(tab, e) { if(e) e.stopPropagation(); window.state.notifTab = tab; window.renderNotifItems(); }
        window.closeAllPopups = function() { document.querySelectorAll('.glass-popup').forEach(el => el.classList.remove('show')); const search = document.getElementById('search-dropdown'); if(search) search.classList.add('hidden'); }
        document.addEventListener('click', window.closeAllPopups);
        window.doSearch = function(query) { 
            const dropdown = document.getElementById('search-dropdown'); 
            const resultsContainer = document.getElementById('search-results-list'); 
            if(!dropdown || !resultsContainer) return;
            if (!query || query.trim() === '') { dropdown.classList.add('hidden'); return; } 
            dropdown.classList.remove('hidden'); 
            const q = query.toLowerCase(); 
            const results = window.DB.apps.filter(a => a.status && (a.roles.includes('Umum') || a.roles.includes(window.state.user.role)) && (a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q))); 
            if (results.length === 0) { resultsContainer.innerHTML = `<div class="p-4 text-center text-[12px] text-brand-muted">Tidak ada hasil.</div>`; return; } 
            let html = ''; 
            results.forEach(app => { html += `<div onclick="navigate('#app-${app.id}')" class="p-3 hover:bg-white/60 cursor-pointer flex items-center gap-3 border-b border-white/20 last:border-0"><div class="w-8 h-8 rounded-lg ${app.bg} flex items-center justify-center shrink-0 border border-white"><i data-lucide="${app.icon}" class="w-4 h-4 ${app.color}"></i></div><div><p class="text-[13px] font-bold text-brand-navy mb-0.5">${app.name}</p><p class="text-[10px] text-brand-muted">${app.cat}</p></div></div>`; }); 
            resultsContainer.innerHTML = html; 
            if (window.lucide) lucide.createIcons(); 
        }
        window.doLogout = function() { window.state.isLoggedIn = false; window.navigate('#login'); }
        window.doLogin = function() { window.state.isLoggedIn = true; window.navigate('#home'); }
        window.changeZoom = function(delta) { window.state.zoom += delta; if (window.state.zoom < 0.5) window.state.zoom = 0.5; if (window.state.zoom > 1.5) window.state.zoom = 1.5; document.querySelectorAll('.zoom-val').forEach(el => { el.innerText = Math.round(window.state.zoom * 100) + '%'; }); const wrapper = document.getElementById('content-zoom-wrapper'); if(wrapper) { wrapper.style.transform = `scale(${window.state.zoom})`; wrapper.style.width = `${100 / window.state.zoom}%`; wrapper.style.height = `${100 / window.state.zoom}%`; } }

            const rows = filtered.map((g, idx) => {
                const renderMapelBadge = (m, c) => m ? `<div class="flex items-center gap-1.5 py-0.5"><span class="font-bold text-brand-navy">${m}</span><span class="px-1.5 py-0.2 bg-white/70 border border-white rounded text-[10px] text-blue-600 font-semibold">${c || '-'}</span></div>` : '<span class="text-brand-muted/40">-</span>';
                return `<tr class="border-b border-white/30 hover:bg-white/20"><td class="py-3 px-4 sticky-col-1 font-bold text-[12px] text-brand-navy">${idx + 1}</td><td class="py-3 px-4 sticky-col-2 font-bold text-[13px] text-brand-navy">${g.nama}</td><td class="py-3 px-4 sticky-col-3 text-[12px]"><span class="px-2 py-0.5 rounded bg-blue-100 text-blue-600 font-bold">${g.waliKelas || '-'}</span></td><td class="py-3 px-4 text-[12px]"><span class="px-2 py-0.5 rounded bg-purple-100 text-purple-600 font-bold">${g.tugasTambahan || '-'}</span></td><td class="py-3 px-4 text-[12px]"><span class="px-2 py-0.5 rounded bg-orange-100 text-orange-600 font-bold">${g.pelatihEkstra || '-'}</span></td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel1, g.kelasMapel1)}</td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel2, g.kelasMapel2)}</td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel3, g.kelasMapel3)}</td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel4, g.kelasMapel4)}</td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel5, g.kelasMapel5)}</td><td class="py-3 px-4 bg-[#fffcf5]/50">${renderMapelBadge(g.mapel6, g.kelasMapel6)}</td><td class="py-3 px-4 sticky-col-right text-right"><button onclick="showEditTugasModal(${g.id})" class="w-7 h-7 rounded-lg bg-white/80 hover:bg-white flex items-center justify-center text-brand-blue border border-white shadow-sm inline-flex"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button></td></tr>`;
            }).join('');

            return `<div class="p-5 md:p-8 max-w-[1400px] mx-auto overflow-y-auto flex flex-col h-full"><div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6"><h1 class="text-[20px] font-extrabold text-brand-navy">Tugas & Jadwal Mengajar Pegawai</h1><div class="flex flex-wrap items-center gap-2"><div class="glass-pill h-[38px] rounded-full flex items-center px-3 border border-white/80 w-[220px]"><i data-lucide="search" class="w-4 h-4 text-brand-muted mr-2"></i><input type="text" oninput="window.state.searchQueryTugas=this.value;window.render();" value="${window.state.searchQueryTugas || ''}" placeholder="Cari tugas/guru..." class="bg-transparent border-none outline-none text-[12px] font-medium w-full text-brand-navy"></div><button onclick="downloadFormatTugas()" class="px-3.5 py-2 bg-white/70 hover:bg-white text-brand-navy rounded-xl text-xs font-bold shadow-sm border border-white flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Format</button><button onclick="document.getElementById('fileTugas').click()" class="px-3.5 py-2 bg-teal-500 hover:bg-teal-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Upload</button><button onclick="showAddTugasModal()" class="px-3.5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah</button><button onclick="globalSave()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> Simpan</button></div></div><div class="glass-panel p-0 rounded-[24px] flex-1 overflow-hidden flex flex-col shadow-sm"><div class="overflow-x-auto slider-scroll flex-1"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="border-b border-white/40 text-[11px] font-extrabold text-brand-muted"><th class="py-3 px-4 sticky-col-1-header">NO</th><th class="py-3 px-4 sticky-col-2-header">NAMA PEGAWAI</th><th class="py-3 px-4 sticky-col-3-header">WALI KELAS</th><th class="py-3 px-4">TUGAS TAMBAHAN</th><th class="py-3 px-4">PELATIH EKSTRA</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 1 & KELAS</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 2 & KELAS</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 3 & KELAS</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 4 & KELAS</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 5 & KELAS</th><th class="py-3 px-4 bg-[#fff8e6]">MAPEL 6 & KELAS</th><th class="py-3 px-4 sticky-col-right-header text-right">AKSI</th></tr></thead><tbody class="text-[12px]">${rows}</tbody></table></div></div></div>`;
        }

        window.renderAdminSiswa = function() {
            const q = (window.state.searchQuerySiswa || '').toLowerCase();
            const filtered = window.DB.siswa.filter(s => s.nama_siswa.toLowerCase().includes(q) || (s.nis && s.nis.toLowerCase().includes(q)) || (s.kelas && s.kelas.toLowerCase().includes(q)));
            const rows = filtered.map((s, idx) => `<tr class="border-b border-white/30 hover:bg-white/20"><td class="py-3 px-4 sticky-col-1 font-bold text-[12px] text-brand-navy">${idx + 1}</td><td class="py-3 px-4 sticky-col-2 font-bold text-[12px] text-brand-navy">${s.no_presensi || '-'}</td><td class="py-3 px-4 sticky-col-3 font-bold text-[13px] text-brand-navy"><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-teal-100 flex items-center justify-center text-teal-600"><i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i></div><div><p class="font-bold text-brand-navy">${s.nama_siswa}</p><p class="text-[10px] text-brand-muted">NISN: ${s.nisn || '-'} • NIK: ${s.nik_anak || '-'}</p></div></div></td><td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-blue-100 text-blue-600 font-bold">${s.kelas || '-'}</span></td><td class="py-3 px-4 text-[12px] text-brand-muted">${s.nis || '-'}</td><td class="py-3 px-4 text-[12px] text-brand-muted">${s.l_p || '-'}</td><td class="py-3 px-4 text-[12px] text-brand-muted">${s.tempat_lahir || '-'}, ${formatDateId(s.tgl_lahir)}</td><td class="py-3 px-4 text-[12px] text-brand-muted">${s.nama_ayah || '-'}</td><td class="py-3 px-4 sticky-col-right text-right"><button onclick="showEditSiswaModal(${s.id})" class="w-7 h-7 rounded-lg bg-white/80 hover:bg-white flex items-center justify-center text-brand-blue border border-white shadow-sm inline-flex"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button></td></tr>`).join('');
            
            return `<div class="p-5 md:p-8 max-w-[1200px] mx-auto overflow-y-auto flex flex-col h-full"><div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6"><h1 class="text-[20px] font-extrabold text-brand-navy">Data Siswa & Wali</h1><div class="flex flex-wrap items-center gap-2"><div class="glass-pill h-[38px] rounded-full flex items-center px-3 border border-white/80 w-[220px]"><i data-lucide="search" class="w-4 h-4 text-brand-muted mr-2"></i><input type="text" oninput="window.state.searchQuerySiswa=this.value;window.render();" value="${window.state.searchQuerySiswa || ''}" placeholder="Cari siswa..." class="bg-transparent border-none outline-none text-[12px] font-medium w-full text-brand-navy"></div><button onclick="downloadFormatSiswa()" class="px-3.5 py-2 bg-white/70 hover:bg-white text-brand-navy rounded-xl text-xs font-bold shadow-sm border border-white flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i> Format</button><button onclick="document.getElementById('fileSiswa').click()" class="px-3.5 py-2 bg-teal-500 hover:bg-teal-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Upload</button><button onclick="showAddSiswaModal()" class="px-3.5 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Tambah</button><button onclick="globalSave()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-md flex items-center gap-1.5"><i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> Simpan</button></div></div><div class="glass-panel p-0 rounded-[24px] flex-1 overflow-hidden flex flex-col shadow-sm"><div class="overflow-x-auto slider-scroll flex-1"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="border-b border-white/40 text-[11px] font-extrabold text-brand-muted"><th class="py-3 px-4 sticky-col-1-header">NO</th><th class="py-3 px-4 sticky-col-2-header">PRES</th><th class="py-3 px-4 sticky-col-3-header">NAMA SISWA</th><th class="py-3 px-4">KELAS</th><th class="py-3 px-4">NIS</th><th class="py-3 px-4">L/P</th><th class="py-3 px-4">TEMPAT, TANGGAL LAHIR</th><th class="py-3 px-4">NAMA AYAH</th><th class="py-3 px-4 sticky-col-right-header text-right">AKSI</th></tr></thead><tbody class="text-[12px]">${rows}</tbody></table></div></div></div>`;
        }

        window.renderAdminLogs = function() {
            const rows = window.DB.logs.map(l => `<tr class="border-b border-white/30"><td class="py-3 px-4 font-bold text-[12px] text-brand-muted">${l.time}</td><td class="py-3 px-4 font-bold text-[12px] text-brand-navy">${l.user}</td><td class="py-3 px-4 text-[12px] text-brand-navy">${l.action} <strong class="text-blue-500">${l.target}</strong></td><td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-${l.color}-100 text-${l.color}-600 text-[10px] font-bold">${l.type}</span></td></tr>`).join('');
            return `<div class="p-5 md:p-8 max-w-[1200px] mx-auto overflow-y-auto"><h1 class="text-[20px] font-extrabold text-brand-navy mb-6">Log Aktivitas Sistem</h1><div class="glass-panel p-5 rounded-[24px]"><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="border-b border-white/40 text-[11px] font-extrabold text-brand-muted"><th class="py-3 px-4">Waktu</th><th class="py-3 px-4">Pengguna</th><th class="py-3 px-4">Aksi</th><th class="py-3 px-4">Modul</th></tr></thead><tbody class="text-[12px]">${rows}</tbody></table></div></div></div>`;
        }

        window.renderAdminLayout = function(isMobile) {
            let content = '';
            if (window.state.path === '#admin-dashboard') content = window.renderAdminDashboard();
            else if (window.state.path === '#admin-menu-apps') content = window.renderAdminMenuApps();
            else if (window.state.path === '#admin-users') content = window.renderAdminUsers();
            else if (window.state.path === '#admin-guru') content = window.renderAdminGuru();
            else if (window.state.path === '#admin-tugas-pegawai') content = window.renderAdminTugasPegawai();
            else if (window.state.path === '#admin-siswa') content = window.renderAdminSiswa();
            else if (window.state.path === '#admin-logs') content = window.renderAdminLogs();
            else content = window.renderAdminDashboard();

            let mobileNav = window.getAdminMobileNavLinks();
            let sidebarLinks = window.getAdminSidebarLinks();

            return `<div class="flex h-[100dvh] w-full overflow-hidden relative">
                ${!isMobile ? `<aside class="w-[220px] shrink-0 bg-white/30 border-r border-white/40 backdrop-blur-3xl z-40 relative flex flex-col"><div class="h-[60px] flex items-center gap-2.5 px-5 cursor-pointer border-b border-white/30" onclick="navigate('#home')"><div class="scale-90 origin-left">${logoSvg}</div><span class="text-[14px] font-extrabold text-brand-navy tracking-tight">Panel Admin</span></div><nav class="flex flex-col gap-1.5 w-full p-3 overflow-y-auto slider-scroll flex-1">${sidebarLinks}</nav><div class="p-3 border-t border-white/30"><button onclick="navigate('#home')" class="w-full py-2.5 bg-white/70 hover:bg-white text-brand-navy font-bold text-[12px] rounded-xl shadow-sm flex items-center justify-center gap-2 border border-white"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Portal</button></div></aside>` : ''}
                <div class="flex-1 flex flex-col h-full overflow-hidden relative w-full ${isMobile ? 'pb-[70px]' : ''}">
                    ${isMobile ? `<header class="h-[56px] flex items-center justify-between px-4 shrink-0 z-30 bg-white/40 backdrop-blur-xl border-b border-white/50 w-full"><button onclick="navigate('#home')" class="flex items-center gap-1.5 text-brand-navy font-bold text-[13px]"><i data-lucide="arrow-left" class="w-4 h-4"></i> Portal</button><span class="font-bold text-[13px] text-brand-navy">Panel Admin</span><div class="w-6"></div></header>` : ''}
                    <main class="flex-1 w-full relative h-full overflow-hidden flex flex-col bg-white/10">${content}</main>
                </div>
                ${isMobile ? `<nav class="bottom-nav">${mobileNav}</nav>` : ''}
            </div>`;
        }

        window.render = function() {
            const root = document.getElementById('app-root');
            if(!root) return;
            const isMobile = window.innerWidth < 768;
            let html = '';
            if (window.state.path.startsWith('#admin-')) {
                html = window.renderAdminLayout(isMobile);
            } else {
                html = window.renderPortalLayout(isMobile);
            }
            root.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        }

        window.addEventListener('resize', () => window.render());
        window.addEventListener('DOMContentLoaded', () => {
            initCloud();
        });
    </script>
</body>
</html>
