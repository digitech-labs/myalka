        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.9); border-left: 1.5px solid rgba(255, 255, 255, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.2); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-glass), var(--inset-glass);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.7);
        }
        .glass-popup { opacity: 0; transform: scale(0.95); pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
        .glass-popup.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        .slider-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .slider-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 10px; }
        .slider-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.3); border-radius: 10px; margin: 4px; }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            display: flex; justify-content: space-around; align-items: center; z-index: 50; padding-bottom: env(safe-area-inset-bottom);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: theme('colors.brand.muted'); font-size: 11px; font-weight: 600; flex: 1; height: 100%; position: relative; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item.active { color: theme('colors.brand.blue'); }
        .nav-item.active i { transform: translateY(-2px) scale(1.15); stroke-width: 2.5px; }
        .nav-indicator { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 3px; border-radius: 0 0 4px 4px; background-color: theme('colors.brand.blue'); opacity: 0; transition: opacity 0.3s; }
        .nav-item.active .nav-indicator { opacity: 1; }

        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-glass { background: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.9); border-radius: 8px; padding: 6px 10px; width: 100%; outline: none; transition: all 0.2s; font-size: 12px; color: #0f172a; }
        .input-glass:focus { border-color: #3b82f6; background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
        
        #modal-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, 0.25); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s; padding: 20px; }
        #modal-overlay.show { display: flex; opacity: 1; }
        .modal-content { animation: modalZoom 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; background: rgba(255, 255, 255, 0.92); }
        @keyframes modalZoom { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); font-size: 13px; font-weight: 600; color: #0f172a; display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .draggable-row { transition: background-color 0.2s; }
        .draggable-row.dragging { opacity: 0.4; background: rgba(59, 130, 246, 0.1); }
        .draggable-row.drag-over { border-top: 2px solid #3b82f6; }
        .grip-handle { cursor: grab; user-select: none; }
        .grip-handle:active { cursor: grabbing; }

        /* SOLID OPAQUE STICKY COLUMNS & HEADERS TO PREVENT BLEEDING & OVERLAPS */
        .sticky-col-1 { position: sticky; left: 0; z-index: 25; background-color: #ffffff !important; border-right: 1px solid #cbd5e1; }
        .sticky-col-2 { position: sticky; left: 60px; z-index: 25; background-color: #ffffff !important; border-right: 1px solid #cbd5e1; }
        .sticky-col-3 { position: sticky; left: 120px; z-index: 25; background-color: #ffffff !important; border-right: 1px solid #cbd5e1; box-shadow: 4px 0 8px -2px rgba(0,0,0,0.08); }

        .sticky-col-1-header { position: sticky; top: 0; left: 0; z-index: 50; background-color: #e2e8f0 !important; border-right: 1px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; }
        .sticky-col-2-header { position: sticky; top: 0; left: 60px; z-index: 50; background-color: #e2e8f0 !important; border-right: 1px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; }

        @keyframes splashPulse {

        @keyframes floatStar2 {

        window.playNotifSound = function() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(587.33, now); // D5
                osc1.frequency.setValueAtTime(880, now + 0.12); // A5
                osc2.frequency.setValueAtTime(293.66, now);
                osc2.frequency.setValueAtTime(440, now + 0.12);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 0.46);
                osc2.stop(now + 0.46);
            } catch (e) {}
        };

        window.mergeCloudNotifications = function(cloudNotifs, triggerAlertForNew = false) {
            if (!Array.isArray(cloudNotifs) || cloudNotifs.length === 0) return;
            let readIds = [];
            let deletedIds = [];
            let alertedIds = [];
            try {
                readIds = JSON.parse(localStorage.getItem('alka_notif_read_ids') || '[]');
                deletedIds = JSON.parse(localStorage.getItem('alka_notif_deleted_ids') || '[]');
                alertedIds = JSON.parse(localStorage.getItem('alka_notif_alerted_ids') || '["1","2","3"]');
            } catch (e) {
                alertedIds = ["1", "2", "3"];
            }

            let newlyArrived = [];
            const merged = [];

            cloudNotifs.forEach(cn => {
                const cid = String(cn.id);
                if (deletedIds.includes(cid)) return;
                const isRead = readIds.includes(cid);
                const item = { ...cn, read: isRead };

                if (!isRead && !alertedIds.includes(cid)) {
                    newlyArrived.push(item);
                    alertedIds.push(cid);
                }
                merged.push(item);
            });

            try {
                localStorage.setItem('alka_notif_alerted_ids', JSON.stringify(alertedIds));
            } catch (e) {}

            window.DB.notifications = cloudNotifs;
            window.NOTIFICATIONS = merged;
            window.saveNotificationsToStorage();
            window.updateNotifBadgesUI();

            if (newlyArrived.length > 0) {
                const latest = newlyArrived[0];
                window.triggerNativeDeviceNotification(latest);
                if (triggerAlertForNew) {
                    window.showToast(`🔔 Notifikasi Baru: ${latest.title}`, 'bell-ring', 'text-blue-500');
                }
            }
        };

        // ============================================================================
        // SMART INDONESIAN DATE PARSER
        // ============================================================================
        window.formatDateId = function(dateVal) {
            if (dateVal === null || dateVal === undefined || dateVal === '' || dateVal === '-') return '-';
            const str = String(dateVal).trim();
            if (!str || str === '-') return '-';

            const monthsFull = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

            if (/^\d{4}$/.test(str)) return str;

            if (/^\d{5}(\.\d+)?$/.test(str)) {
                const serial = Math.floor( parseFloat(str) );
                if (serial > 10000 && serial < 80000) {
                    const utcDays = serial - 25569;
                    const dateObj = new Date(utcDays * 86400 * 1000);
                    if (!isNaN(dateObj.getTime())) {
                        const d = dateObj.getUTCDate();
                        const m = dateObj.getUTCMonth();
                        const y = dateObj.getUTCFullYear();
                        return `${d} ${monthsFull[m]} ${y}`;
                    }
                }
            }

            if (/[a-zA-Z]{3,}/.test(str)) return str;

            let parts = str.split(/[-/]/);
            if (parts.length === 3) {
                let day, month, year;
                if (parts[0].length === 4) {
                    year = parts[0]; month = parts[1]; day = parts[2];
                } else {
                    day = parts[0]; month = parts[1]; year = parts[2];
                }
                const mIndex = parseInt(month, 10) - 1;
                const dNum = parseInt(day, 10);
                if (!isNaN(dNum) && mIndex >= 0 && mIndex < 12) {
                    return `${dNum} ${monthsFull[mIndex]} ${year}`;
                }
            }
            return str;
        };

            if (!Array.isArray(arr) || arr.length <= 1) return arr;

            const lastNo = parseInt(arr[arr.length - 1] && arr[arr.length - 1].no, 10);
            if (!isNaN(firstNo) && !isNaN(lastNo) && firstNo > lastNo) {
                return [...arr].sort((a, b) => (parseInt(a.no, 10) || 0) - (parseInt(b.no, 10) || 0));
            }
            return arr;
        }

        async function initCloud() {
            window.restoreSessionFromStorage();
            try {
                const cachedState = localStorage.getItem('alka_portal_state_cache');
                if (cachedState) {
                    const parsedCache = JSON.parse(cachedState);
                    if (parsedCache && typeof parsedCache === 'object') {
                        if (Array.isArray(parsedCache.menus)) window.DB.menus = parsedCache.menus;
                        if (Array.isArray(parsedCache.deletedAppIds)) window.DB.deletedAppIds = parsedCache.deletedAppIds;
                        if (Array.isArray(parsedCache.apps)) window.DB.apps = parsedCache.apps;
                        if (Array.isArray(parsedCache.users)) window.DB.users = parsedCache.users;
                        if (Array.isArray(parsedCache.logs)) window.DB.logs = parsedCache.logs;
                        if (Array.isArray(parsedCache.guru)) window.DB.guru = parsedCache.guru;
                        if (Array.isArray(parsedCache.siswa)) window.DB.siswa = ensureNaturalSiswaOrder(parsedCache.siswa);
                    }
                }
            } catch (e) {}

            if (!supabaseClient) { 
                window.state.cloudStatus = 'offline';
                window.ensureDefaultPasswords(); 
                window.render(); 
                return; 
            }
            try {
                const { data, error } = await supabaseClient.from('portal_state').select('data').eq('id', 1).maybeSingle();
                if (!error && data && data.data && Object.keys(data.data).length > 0) {
                    const cloudDB = data.data;
                    if (Array.isArray(cloudDB.menus)) window.DB.menus = cloudDB.menus;
                    if (Array.isArray(cloudDB.deletedAppIds)) window.DB.deletedAppIds = cloudDB.deletedAppIds;
                    if (Array.isArray(cloudDB.apps)) window.DB.apps = cloudDB.apps;
                    if (Array.isArray(cloudDB.users)) window.DB.users = cloudDB.users;
                    if (Array.isArray(cloudDB.logs)) window.DB.logs = cloudDB.logs;
                    if (Array.isArray(cloudDB.guru)) window.DB.guru = cloudDB.guru;
                    if (Array.isArray(cloudDB.siswa)) window.DB.siswa = ensureNaturalSiswaOrder(cloudDB.siswa);
                    if (Array.isArray(cloudDB.notifications)) window.mergeCloudNotifications(cloudDB.notifications, false);
                    try { localStorage.setItem('alka_portal_state_cache', JSON.stringify(cloudDB)); } catch (e) {}
                    window.state.cloudStatus = 'connected';
                    window.state.cloudLastSync = new Date().toLocaleTimeString('id-ID');
                } else if (error) {
                    window.state.cloudStatus = 'error';
                    console.warn('Supabase notice:', error.message);
                } else {
                    window.state.cloudStatus = 'connected';
                    window.state.cloudLastSync = new Date().toLocaleTimeString('id-ID');
                }
                window.ensureDefaultPasswords();
                window.render();
                syncRelationalTables();

                if (!isCanvasSandbox()) {
                    try {
                        const channel = supabaseClient.channel('custom-all-channel').on('postgres_changes', { event: '*', schema: 'public', table: 'portal_state' }, (payload) => {
                            const newData = payload.new && payload.new.data ? payload.new.data : null;
                            if (newData) {
                                if (Array.isArray(newData.menus)) window.DB.menus = newData.menus;
                                if (Array.isArray(newData.deletedAppIds)) window.DB.deletedAppIds = newData.deletedAppIds;
                                if (Array.isArray(newData.apps)) window.DB.apps = newData.apps;
                                if (Array.isArray(newData.users)) window.DB.users = newData.users;
                                if (Array.isArray(newData.logs)) window.DB.logs = newData.logs;
                                if (Array.isArray(newData.guru)) window.DB.guru = newData.guru;
                                if (Array.isArray(newData.siswa)) window.DB.siswa = ensureNaturalSiswaOrder(newData.siswa);
                                if (Array.isArray(newData.notifications)) window.mergeCloudNotifications(newData.notifications, true);
                                try { localStorage.setItem('alka_portal_state_cache', JSON.stringify(newData)); } catch (e) {}
                                window.ensureDefaultPasswords();
                                window.render();
                            }
                        });
                        channel.subscribe();
                    } catch (wsErr) {}
                }
            } catch (err) {
                window.ensureDefaultPasswords();
                window.render();
            }
        }

        // ============================================================================
        // PREMIUM STYLED EXCEL GENERATOR
        // ============================================================================
        window.exportPremiumExcel = function({ sheetName, fileName, headers, rows, getHeaderColor, centerCols = [], boldCols = [] }) {
            const aoa = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(aoa);

            const colWidths = headers.map((h, colIdx) => {
                let maxLen = String(h || '').length;
                rows.forEach(r => {
                    const cellStr = String(r[colIdx] !== undefined && r[colIdx] !== null ? r[colIdx] : '');
                    if (cellStr.length > maxLen) maxLen = cellStr.length;
                });
                return { wch: Math.min(Math.max(maxLen + 5, 12), 48) };
            });
            ws['!cols'] = colWidths;

            ws['!rows'] = [
                { hpt: 32 },
                ...rows.map(() => ({ hpt: 24 }))
            ];

            if (headers.length > 0) {
                const lastColRef = XLSX.utils.encode_col(headers.length - 1);
                ws['!autofilter'] = { ref: `A1:${lastColRef}${rows.length + 1}` };
            }

            const range = XLSX.utils.decode_range(ws['!ref']);
            const borderThin = {
                top: { style: 'thin', color: { rgb: 'CBD5E1' } },
                bottom: { style: 'thin', color: { rgb: 'CBD5E1' } },
                left: { style: 'thin', color: { rgb: 'CBD5E1' } },
                right: { style: 'thin', color: { rgb: 'CBD5E1' } }
            };

            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cellAddress]) ws[cellAddress] = { t: 's', v: '' };
                    ws[cellAddress].t = 's';
                    ws[cellAddress].v = String(ws[cellAddress].v !== undefined && ws[cellAddress].v !== null ? ws[cellAddress].v : '');

                    if (R === 0) {
                        const bgHex = getHeaderColor ? getHeaderColor(C, headers[C]) : '1E3A8A';
                        ws[cellAddress].s = {
                            fill: { fgColor: { rgb: bgHex } },
                            font: { name: 'Segoe UI', sz: 10, bold: true, color: { rgb: 'FFFFFF' } },
                            alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
                            border: borderThin
                        };
                    } else {
                        const isEvenRow = R % 2 === 0;
                        const isCentered = centerCols.includes(C);
                        const isBold = boldCols.includes(C);
                        ws[cellAddress].s = {
                            fill: { fgColor: { rgb: isEvenRow ? 'F8FAFC' : 'FFFFFF' } },
                            font: { name: 'Segoe UI', sz: 10, bold: isBold, color: { rgb: '0F172A' } },
                            alignment: { horizontal: isCentered ? 'center' : 'left', vertical: 'center', wrapText: false },
                            border: borderThin
                        };
                    }
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, fileName);
        };

            if (!Array.isArray(app.roles)) app.roles = ['Umum'];

            if (roleName === 'Umum') {
                if (isChecked) {
                    app.roles = ['Umum'];
                } else {
                    app.roles = ['Admin', 'Pegawai'];
                }
            } else {
                app.roles = app.roles.filter(r => r !== 'Umum');
                if (isChecked) {
                    if (!app.roles.includes(roleName)) app.roles.push(roleName);
                } else {
                    app.roles = app.roles.filter(r => r !== roleName);
                    if (app.roles.length === 0) app.roles = ['Umum'];
                }
            }
            window.logActivity(`Mengubah visibilitas role aplikasi ${app.name}`, app.roles.join(', '), 'Aplikasi', 'blue');

            window.globalSave();

        window.saveNewApp = async function(e) {
            e.preventDefault();
            const name = document.getElementById('newAppName').value.trim();
            const cat = document.getElementById('newAppCat').value.trim() || 'Akademik';
            const section = document.getElementById('newAppSection').value;
            const icon = document.getElementById('newAppIcon').value.trim() || 'layout-grid';
            const colorId = document.getElementById('newAppColor').value;
            const url = document.getElementById('newAppUrl').value.trim();

            let baseSlug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || ('app-' + Date.now());
            let appId = baseSlug;
            if (window.DB.apps.some(a => a.id === appId)) {
                appId = baseSlug + '-' + Math.floor(Math.random() * 1000);
            }

            if (Array.isArray(window.DB.deletedAppIds)) {
                window.DB.deletedAppIds = window.DB.deletedAppIds.filter(x => x !== appId);
            }

            const foundColor = AVAILABLE_COLORS.find(c => c.id === colorId) || AVAILABLE_COLORS[0];
            let roles = [];
            if (document.getElementById('newAppRoleUmum').checked) {
                roles.push('Umum');
            } else {
                if (document.getElementById('newAppRoleAdmin').checked) roles.push('Admin');
                if (document.getElementById('newAppRolePegawai').checked) roles.push('Pegawai');
                if (document.getElementById('newAppRoleWarid').checked) roles.push('Warid');
                if (roles.length === 0) roles.push('Admin');
            }

            const newApp = {
                id: appId,
                name: name,
                section: section,
                icon: icon,
                color: foundColor.text,
                bg: foundColor.bg,
                url: url,
                cat: cat,
                status: true,
                roles: roles
            };

            window.DB.apps.push(newApp);
            window.logActivity('Menambahkan aplikasi baru', name, 'Aplikasi', 'green');
            window.showToast(`Aplikasi "${name}" berhasil ditambahkan! Menyimpan ke Cloud...`);
            window.closeModal();
            window.render();
            await window.globalSave();
        };

        window.executeDeleteApp = async function(id) {
            const idx = window.DB.apps.findIndex(a => String(a.id) === String(id));
            if (idx !== -1) {
                const removed = window.DB.apps.splice(idx, 1)[0];
                if (!Array.isArray(window.DB.deletedAppIds)) window.DB.deletedAppIds = [];
                if (!window.DB.deletedAppIds.includes(String(id))) window.DB.deletedAppIds.push(String(id));

                if (Array.isArray(window.DB.users)) {
                    window.DB.users.forEach(u => {
                        if (Array.isArray(u.adminApps)) {
                            u.adminApps = u.adminApps.filter(appId => String(appId) !== String(id));
                        }
                    });
                }
                if (Array.isArray(window.DB.guru)) {
                    window.DB.guru.forEach(g => {
                        if (Array.isArray(g.adminApps)) {
                            g.adminApps = g.adminApps.filter(appId => String(appId) !== String(id));
                        }
                    });
                }
                window.logActivity('Menghapus aplikasi', removed.name, 'Aplikasi', 'red');
                window.showToast(`Aplikasi "${removed.name}" telah dihapus.`, 'trash-2', 'text-red-500');
            }
            window.closeModal();
            window.render();
            await window.globalSave();
        };

        window.showAddUserModal = function() {

        window.showEditUserModal = function(id) {
            const user = window.DB.users.find(u => String(u.id) === String(id));
            if (!user) return;
            window.openModal(window.buildUserModalFormHtml(user));
        };

        window.saveUserFormModal = function(event, editId) {
            event.preventDefault();
            const guruIdVal = document.getElementById('modalUserGuruSelect').value;
            const name = document.getElementById('modalUserName').value.trim();
            const email = document.getElementById('modalUserEmail').value.trim() || window.makeEmailFromName(name);
            const password = document.getElementById('modalUserPassword').value.trim() || DEFAULT_PASSWORD;
            const role = document.getElementById('modalUserRole').value;
            const status = document.getElementById('modalUserStatus').value === 'true';

            const checkedAdminApps = Array.from(document.querySelectorAll('input[name="modalUserAdminApps"]:checked')).map(cb => cb.value);

            let targetUser = null;
            if (editId !== null && editId !== undefined) {
                targetUser = window.DB.users.find(u => String(u.id) === String(editId));
            }
            if (!targetUser && guruIdVal) {
                targetUser = window.DB.users.find(u => String(u.guruId) === String(guruIdVal));
            }
            if (!targetUser) {
                targetUser = window.DB.users.find(u => u.name && u.name.trim().toLowerCase() === name.toLowerCase());
            }

            if (targetUser) {
                targetUser.name = name;
                targetUser.email = email;
                targetUser.password = password;
                targetUser.role = role;
                targetUser.status = status;
                targetUser.adminApps = checkedAdminApps;
                if (guruIdVal) targetUser.guruId = Number(guruIdVal) || guruIdVal;
                window.logActivity('Memperbarui hak akses pengguna', name, 'Pengguna', 'purple');
                window.showToast(`Hak akses ${name} berhasil diperbarui!`);
            } else {
                targetUser = {
                    id: Date.now(),
                    guruId: guruIdVal ? (Number(guruIdVal) || guruIdVal) : undefined,
                    name: name,
                    email: email,
                    role: role,
                    password: password,
                    status: status,
                    lastLogin: 'Belum pernah',
                    adminApps: checkedAdminApps
                };
                window.DB.users.unshift(targetUser);
                window.logActivity('Menambahkan pengguna baru', name, 'Pengguna', 'blue');
                window.showToast(`Pengguna ${name} berhasil ditambahkan!`);
            }

            // Sinkronkan juga ke Data Pegawai (window.DB.guru) jika terhubung
            const linkedGuru = window.DB.guru.find(g =>
                (targetUser.guruId !== undefined && String(g.id) === String(targetUser.guruId)) ||
                (g.nama && g.nama.trim().toLowerCase() === name.toLowerCase())
            );
            if (linkedGuru) {
                linkedGuru.nama = name;
                linkedGuru.password = password;
                linkedGuru.status = status;
                linkedGuru.adminApps = [...checkedAdminApps];
            }

            // Jika yang diedit adalah user yang sedang login saat ini, perbarui sesi aktifnya
            if (window.state.isLoggedIn && window.state.user &&
                (String(window.state.user.id) === String(targetUser.id) ||
                 window.state.user.name.trim().toLowerCase() === targetUser.name.trim().toLowerCase())) {
                window.state.user.name = targetUser.name;
                window.state.user.role = targetUser.role;
                window.state.user.adminApps = [...checkedAdminApps];
            }

            window.closeModal();
            window.render();
        };

        window.navigate = function(hash) {
            window.closeAllPopups();
            window.location.hash = hash;
            window.state.path = hash;
            window.state.zoom = 1.0;
            if (hash === '#apps' || hash === '#edukasi') {
                window.state.slider2Minimized = false;
            }
            window.render();
        };
        window.addEventListener('hashchange', () => { if(window.location.hash !== window.state.path) { window.state.path = window.location.hash || '#home'; window.render(); } });
        window.togglePopup = function(id, e) { if(e) e.stopPropagation(); window.closeAllPopups(); const el = document.getElementById(id); if(el) { el.classList.toggle('show'); if(id.startsWith('notif')) window.renderNotifItems(); } };
        window.switchNotifTab = function(tab, e) { if(e) e.stopPropagation(); window.state.notifTab = tab; window.renderNotifItems(); };
        window.closeAllPopups = function() { document.querySelectorAll('.glass-popup').forEach(el => el.classList.remove('show')); const search = document.getElementById('search-dropdown'); if(search) search.classList.add('hidden'); };
        document.addEventListener('click', window.closeAllPopups);

        window.doSearch = function(query) {
            const dropdown = document.getElementById('search-dropdown');
            const resultsContainer = document.getElementById('search-results-list');
            if (!query || query.trim() === '') { dropdown.classList.add('hidden'); return; }
            dropdown.classList.remove('hidden');
            const q = query.toLowerCase();
            const results = window.DB.apps.filter(a => window.canUserSeeApp(a) && (a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q)));
            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="p-4 text-center text-[12px] text-brand-muted">Tidak ada hasil.</div>`;
                return;
            }
            let html = '';
            results.forEach(app => {
                html += `<div onclick="selectAppFromSlider2('${app.id}')" class="p-3 hover:bg-white/60 cursor-pointer flex items-center gap-3 border-b border-white/20 last:border-0"><div class="w-8 h-8 rounded-lg ${app.bg} flex items-center justify-center shrink-0 border border-white"><i data-lucide="${app.icon}" class="w-4 h-4 ${app.color}"></i></div><div><p class="text-[13px] font-bold text-brand-navy mb-0.5">${app.name}</p><p class="text-[10px] text-brand-muted">${app.cat}</p></div></div>`;
            });
            resultsContainer.innerHTML = html;
            if (window.lucide) lucide.createIcons();
        };

        // ============================================================================
        // DUAL-BRIDGE SSO AUTO-LOGIN ENGINE FOR IFRAME APPS (DENGAN DELEGASI ADMIN)
        // ============================================================================
        window.resolveActiveIframeAppId = function(rawUrl) {
            if (window.state.path && window.state.path.startsWith('#app-')) {
                return window.state.path.replace('#app-', '');
            }
            const targetUrl = rawUrl || '';
            if (targetUrl && Array.isArray(window.DB.apps)) {
                const cleanTarget = targetUrl.split('?')[0].replace(/\/+$/, '').toLowerCase();
                const matchedApp = window.DB.apps.find(a => {
                    if (!a.url) return false;
                    const cleanAppUrl = a.url.split('?')[0].replace(/\/+$/, '').toLowerCase();
                    return cleanAppUrl === cleanTarget;
                });
                if (matchedApp) return matchedApp.id;
            }
            if (window.state.path && Array.isArray(window.DB.menus)) {
                const activeMenu = window.DB.menus.find(m => m.hash === window.state.path && m.type === 'iframe');
                if (activeMenu && activeMenu.url && Array.isArray(window.DB.apps)) {
                    const cleanMenuUrl = activeMenu.url.split('?')[0].replace(/\/+$/, '').toLowerCase();
                    const matchedApp = window.DB.apps.find(a => {
                        if (!a.url) return false;
                        const cleanAppUrl = a.url.split('?')[0].replace(/\/+$/, '').toLowerCase();
                        return cleanAppUrl === cleanMenuUrl;
                    });
                    if (matchedApp) return matchedApp.id;
                }
            }
            return null;
        };

        window.getAlkaSsoPayload = function(rawUrl) {
            const isLoggedIn = Boolean(window.state.isLoggedIn);
            const userObj = isLoggedIn && window.state.user ? window.state.user : { id: 0, name: 'Tamu', role: 'Tamu', avatar: '', adminApps: [] };
            const userAdminApps = isLoggedIn && Array.isArray(userObj.adminApps) ? userObj.adminApps : [];
            const currentAppId = window.resolveActiveIframeAppId(rawUrl);

            const isPortalAdmin = isLoggedIn && (userObj.role === 'Super Admin' || userObj.role === 'Admin');
            const isDelegatedAppAdmin = Boolean(isLoggedIn && currentAppId && userAdminApps.includes(currentAppId));
            const isAdmin = Boolean(isPortalAdmin || isDelegatedAppAdmin);

            return {
                type: 'ALKA_SSO_AUTH',
                source: 'MY_ALKA_PORTAL',
                isLoggedIn: isLoggedIn,
                isAdmin: isAdmin,
                appId: currentAppId || '',
                adminApps: userAdminApps,
                role: isLoggedIn ? userObj.role : 'Tamu',
                user: {
                    id: userObj.id || 0,
                    name: userObj.name || 'Tamu',
                    role: isLoggedIn ? userObj.role : 'Tamu',
                    isAdmin: isAdmin,
                    adminApps: userAdminApps,
                    avatar: isLoggedIn ? (userObj.avatar || window.getUserAvatarUrl(userObj.name)) : ''
                },
                timestamp: Date.now()
            };
        };

        window.buildSsoIframeUrl = function(rawUrl) {
            if (!rawUrl) return '';
            try {
                const payload = window.getAlkaSsoPayload(rawUrl);
                const parsedUrl = new URL(rawUrl, window.location.href);
                parsedUrl.searchParams.set('alka_sso', '1');
                parsedUrl.searchParams.set('alka_logged_in', payload.isLoggedIn ? '1' : '0');
                parsedUrl.searchParams.set('alka_is_admin', payload.isAdmin ? '1' : '0');
                parsedUrl.searchParams.set('alka_role', payload.role);
                parsedUrl.searchParams.set('alka_user', payload.user.name);
                if (payload.adminApps && payload.adminApps.length > 0) {
                    parsedUrl.searchParams.set('alka_admin_apps', payload.adminApps.join(','));
                }
                return parsedUrl.toString();
            } catch (err) {
                return rawUrl;
            }
        };

        window.broadcastSsoToIframe = function(iframeEl) {
            const targetIframe = iframeEl || document.getElementById('alka-main-iframe');
            if (!targetIframe || !targetIframe.contentWindow) return;
            const rawUrl = targetIframe.getAttribute('data-raw-url') || targetIframe.src || '';
            const payload = window.getAlkaSsoPayload(rawUrl);
            try {
                targetIframe.contentWindow.postMessage(payload, '*');
            } catch (err) {}
        };

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'ALKA_REQUEST_SSO') {
                window.broadcastSsoToIframe();
            }
        });

        window.doLogout = function() {
            window.state.isLoggedIn = false;

        window.doLogin = function(e) {
            if (e) e.preventDefault();
            window.ensureDefaultPasswords();
            const idInputEl = document.getElementById('loginIdentifier');
            const passInputEl = document.getElementById('loginPassword');
            const rawIdentifier = idInputEl ? idInputEl.value.trim() : '';
            const rawPassword = passInputEl ? passInputEl.value.trim() : '';

            if (!rawIdentifier || !rawPassword) {
                window.showToast('Masukkan Nama dan Kata Sandi terlebih dahulu!', 'alert-circle', 'text-orange-500');
                return;
            }

            const q = rawIdentifier.toLowerCase();
            let matchedRecord = null;
            let sourceType = null;
            let role = 'Umum';
            let displayName = '';
            let adminApps = [];

            const foundUser = window.DB.users.find(u =>
                (u.name && u.name.toLowerCase() === q) ||
                (u.email && u.email.toLowerCase() === q)
            );
            if (foundUser) {
                if (foundUser.status === false) {
                    window.showToast('Akun Anda sedang dinonaktifkan oleh Admin!', 'ban', 'text-red-500');
                    return;
                }
                matchedRecord = foundUser;
                sourceType = 'users';
                role = foundUser.role || 'Pegawai';
                displayName = foundUser.name;
                adminApps = Array.isArray(foundUser.adminApps) ? [...foundUser.adminApps] : [];
            }

            if (!matchedRecord) {
                const foundGuru = window.DB.guru.find(g =>
                    (g.nama && g.nama.toLowerCase() === q) ||
                    (g.nik && String(g.nik).trim() === rawIdentifier) ||
                    (g.nbm && String(g.nbm).trim() === rawIdentifier)
                );
                if (foundGuru) {
                    const linkedUser = window.DB.users.find(u =>
                        (u.guruId !== undefined && String(u.guruId) === String(foundGuru.id)) ||
                        (u.name && foundGuru.nama && u.name.trim().toLowerCase() === foundGuru.nama.trim().toLowerCase())
                    );
                    if (linkedUser && linkedUser.status === false) {
                        window.showToast('Akun Anda sedang dinonaktifkan oleh Admin!', 'ban', 'text-red-500');
                        return;
                    }
                    matchedRecord = foundGuru;
                    sourceType = 'guru';
                    role = (linkedUser && linkedUser.role) ? linkedUser.role : 'Pegawai';
                    displayName = foundGuru.nama;
                    adminApps = (linkedUser && Array.isArray(linkedUser.adminApps))
                        ? [...linkedUser.adminApps]
                        : (Array.isArray(foundGuru.adminApps) ? [...foundGuru.adminApps] : []);
                }
            }

            if (!matchedRecord) {
                const foundSiswa = window.DB.siswa.find(s =>
                    (s.nama_siswa && s.nama_siswa.toLowerCase() === q) ||
                    (s.nisn && String(s.nisn).trim() === rawIdentifier) ||
                    (s.nis && String(s.nis).trim() === rawIdentifier) ||
                    (s.nik_anak && String(s.nik_anak).trim() === rawIdentifier)
                );
                if (foundSiswa) {
                    matchedRecord = foundSiswa;
                    sourceType = 'siswa';
                    role = 'Warid';
                    displayName = foundSiswa.nama_siswa;
                    adminApps = [];
                }
            }

            if (!matchedRecord) {
                window.showToast('Nama / NISN / NIK tidak ditemukan di database!', 'x-circle', 'text-red-500');
                return;
            }

            const savedPassword = String(matchedRecord.password || DEFAULT_PASSWORD).trim();
            if (rawPassword !== savedPassword) {
                window.showToast('Kata Sandi yang Anda masukkan salah!', 'x-circle', 'text-red-500');
                return;
            }

            const accountSession = {
                id: matchedRecord.id,
                name: displayName,
                role: role,
                sourceType: sourceType,
                adminApps: adminApps,
                avatar: matchedRecord.avatar || window.getUserAvatarUrl(displayName)
            };

            if (savedPassword === DEFAULT_PASSWORD) {
                window.state.pendingLoginAccount = accountSession;
                window.state.forcePasswordChange = true;
                window.showForceChangePasswordModal(accountSession);
                return;
            }

            window.completeUserLogin(accountSession);
        };

        window.completeUserLogin = function(accountSession) {
            window.state.user = accountSession;
            window.state.isLoggedIn = true;
            window.state.forcePasswordChange = false;
            window.state.pendingLoginAccount = null;
            window.MBankingSecurity.lastActivityAt = Date.now();
            window.MBankingSecurity.minimizedAt = null;
            window.saveSessionToStorage();

            const linkedUser = window.DB.users.find(u =>
                String(u.id) === String(accountSession.id) ||
                (u.name && u.name.trim().toLowerCase() === accountSession.name.trim().toLowerCase())
            );
            if (linkedUser) {
                linkedUser.lastLogin = 'Baru saja';
            }

            window.showToast(`Assalamualaikum, selamat datang ${accountSession.name}!`, 'check-circle', 'text-green-500');
            window.navigate('#home');
        };

        window.saveFirstTimePassword = async function(e) {
            e.preventDefault();
            const newPass = document.getElementById('newFirstPass').value.trim();
            const confirmPass = document.getElementById('confirmFirstPass').value.trim();

            if (!newPass || newPass.length < 4) {
                window.showToast('Password baru minimal 4 karakter!', 'alert-circle', 'text-orange-500');
                return;
            }
            if (newPass === DEFAULT_PASSWORD) {
                window.showToast(`Password baru tidak boleh menggunakan password default (${DEFAULT_PASSWORD})!`, 'alert-circle', 'text-orange-500');
                return;
            }
            if (newPass !== confirmPass) {
                window.showToast('Konfirmasi password tidak cocok!', 'x-circle', 'text-red-500');
                return;
            }

            const pending = window.state.pendingLoginAccount;
            if (!pending) return;

            if (pending.sourceType === 'guru') {
                const g = window.DB.guru.find(x => String(x.id) === String(pending.id));
                if (g) g.password = newPass;
                const u = window.DB.users.find(x => String(x.guruId) === String(pending.id) || (x.name && x.name.toLowerCase() === pending.name.toLowerCase()));
                if (u) u.password = newPass;
            } else if (pending.sourceType === 'siswa') {
                const s = window.DB.siswa.find(x => String(x.id) === String(pending.id));
                if (s) s.password = newPass;
            } else if (pending.sourceType === 'users') {
                const u = window.DB.users.find(x => String(x.id) === String(pending.id));
                if (u) {
                    u.password = newPass;
                    const g = window.DB.guru.find(x => (u.guruId && String(x.id) === String(u.guruId)) || (x.nama && x.nama.toLowerCase() === u.name.toLowerCase()));
                    if (g) g.password = newPass;
                }
            }

            window.state.forcePasswordChange = false;
            document.getElementById('modal-overlay').classList.remove('show');
            window.completeUserLogin(pending);
            window.logActivity('Mengganti password default saat login pertama', pending.name, pending.role, 'green');
            await window.globalSave();
        };

        window.saveProfilePassword = async function(e) {
            e.preventDefault();
            const newPass = document.getElementById('profileNewPass').value.trim();
            if (!newPass || newPass.length < 4) {
                window.showToast('Password minimal 4 karakter!', 'alert-circle', 'text-orange-500');
                return;
            }
            if (newPass === DEFAULT_PASSWORD) {
                window.showToast(`Tidak boleh menggunakan password default (${DEFAULT_PASSWORD})!`, 'alert-circle', 'text-orange-500');
                return;
            }
            const cur = window.state.user;
            let updated = false;
            if (cur.sourceType === 'guru') {
                const g = window.DB.guru.find(x => String(x.id) === String(cur.id));
                if (g) { g.password = newPass; updated = true; }
                const u = window.DB.users.find(x => String(x.guruId) === String(cur.id) || (x.name && x.name.toLowerCase() === cur.name.toLowerCase()));
                if (u) { u.password = newPass; updated = true; }
            } else if (cur.sourceType === 'siswa') {
                const s = window.DB.siswa.find(x => String(x.id) === String(cur.id));
                if (s) { s.password = newPass; updated = true; }
            } else {
                const u = window.DB.users.find(x => String(x.id) === String(cur.id));
                if (u) {
                    u.password = newPass;
                    updated = true;
                    const g = window.DB.guru.find(x => (u.guruId && String(x.id) === String(u.guruId)) || (x.nama && x.nama.toLowerCase() === u.name.toLowerCase()));
                    if (g) g.password = newPass;

            if (updated) {
                window.logActivity('Mengubah password melalui Profil Saya', cur.name, cur.role, 'blue');
                await window.globalSave();
                window.showToast('Password Anda berhasil diperbarui di Supabase!', 'check-circle', 'text-green-500');

        window.deleteSingleReadNotif = function(notifId, e) {
            if (e) e.stopPropagation();
            const idx = window.NOTIFICATIONS.findIndex(n => String(n.id) === String(notifId));
            if (idx !== -1) {
                window.NOTIFICATIONS.splice(idx, 1);
                try {
                    const delIds = JSON.parse(localStorage.getItem('alka_notif_deleted_ids') || '[]');
                    if (!delIds.includes(String(notifId))) delIds.push(String(notifId));
                    localStorage.setItem('alka_notif_deleted_ids', JSON.stringify(delIds));
                } catch (err) {}
                window.saveNotificationsToStorage();
                window.renderNotifItems();
                window.updateNotifBadgesUI();
                window.showToast('Notifikasi yang sudah dibaca berhasil dihapus.', 'trash-2', 'text-red-500');
            }
        };

        window.deleteAllReadNotifications = function(e) {
            if (e) e.stopPropagation();
            const readList = window.NOTIFICATIONS.filter(n => n.read);
            const readCount = readList.length;
            if (readCount === 0) {
                window.showToast('Tidak ada notifikasi sudah dibaca untuk dihapus.', 'info', 'text-orange-500');
                return;
            }
            try {
                const delIds = JSON.parse(localStorage.getItem('alka_notif_deleted_ids') || '[]');
                readList.forEach(n => {
                    if (!delIds.includes(String(n.id))) delIds.push(String(n.id));
                });
                localStorage.setItem('alka_notif_deleted_ids', JSON.stringify(delIds));
            } catch (err) {}
            window.NOTIFICATIONS = window.NOTIFICATIONS.filter(n => !n.read);
            window.saveNotificationsToStorage();
            window.renderNotifItems();
            window.updateNotifBadgesUI();
            window.showToast(`${readCount} notifikasi yang sudah dibaca berhasil dihapus!`, 'trash-2', 'text-red-500');
        };

        // ============================================================================

        const GURU_BIODATA_KEYS = ['nama', 'namaGelar', 'password', 'nik', 'nbm', 'jk', 'tempatLahir', 'tanggalLahir', 'provinsi', 'kabupaten', 'kecamatan', 'desa', 'alamatDetail', 'noWa', 'jenisKepegawaian', 'statusKepegawaian', 'pendidikanTerakhir', 'ptTerakhir', 'ptProvinsi', 'ptKabupaten', 'ptKecamatan', 'ptDesa', 'ptAlamatDetail', 'prodi', 'tahunMasuk', 'tahunLulus', 'ayahNama', 'ayahTahun', 'ayahNik', 'ayahPendidikan', 'ibuNama', 'ibuTahun', 'ibuNik', 'ibuPendidikan', 'linkKk', 'linkIjazah'];

        window.downloadFormatGuru = function() {
            const headers = GURU_BIODATA_KEYS.map(k => k.replace(/([A-Z])/g, '_$1').toUpperCase());
            const rows = window.DB.guru.map(g => GURU_BIODATA_KEYS.map(k => k === 'password' ? (g.password || DEFAULT_PASSWORD) : (g[k] || '')));
            window.exportPremiumExcel({
                sheetName: "MasterPegawai",
                fileName: "Format_Master_Pegawai.xlsx",
                headers: headers,
                rows: rows,
                centerCols: [2, 3, 4, 5, 7, 13, 14, 15, 16, 24, 25, 27, 28, 31, 32],
                boldCols: [0, 2],
                getHeaderColor: (colIdx) => {
                    if (colIdx <= 4) return '0F172A';
                    if (colIdx <= 13) return '334155';
                    if (colIdx <= 25) return '1E40AF';
                    if (colIdx <= 33) return 'B45309';
                    return '047857';
                }
            });
        };

        window.triggerUploadGuru = function() { document.getElementById('fileGuru').click(); };
        window.handleUploadGuru = function(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                json.forEach((row, i) => {
                    const rowNik = String(row['NIK'] || '').trim();
                    const rowNama = String(row['NAMA'] || '').trim();
                    let existing = window.DB.guru.find(x => (rowNik && String(x.nik) === rowNik) || (rowNama && x.nama.toLowerCase() === rowNama.toLowerCase()));
                    let g = existing || { id: Date.now() + i, password: DEFAULT_PASSWORD, status: true, waliKelas: '', tugasTambahan: '', pelatihEkstra: '', mapel1: '', kelasMapel1: '', mapel2: '', kelasMapel2: '', mapel3: '', kelasMapel3: '', mapel4: '', kelasMapel4: '', mapel5: '', kelasMapel5: '', mapel6: '', kelasMapel6: '' };
                    GURU_BIODATA_KEYS.forEach(k => {
                        const header = k.replace(/([A-Z])/g, '_$1').toUpperCase();
                        if (row[header] !== undefined) {
                            if (k === 'tanggalLahir') g[k] = window.formatDateId(row[header]);
                            else if (k === 'password') g[k] = String(row[header] || DEFAULT_PASSWORD).trim() || DEFAULT_PASSWORD;
                            else g[k] = row[header];
                        }
                    });
                    if (!g.password) g.password = DEFAULT_PASSWORD;
                    if (!existing) window.DB.guru.push(g);
                });
                window.syncUsersWithGuru();
                window.showToast(json.length + ' Data Pegawai Diimpor!');
                window.logActivity('Import Excel Pegawai', json.length + ' Baris', 'Pegawai', 'blue');
                window.render();
                document.getElementById('fileGuru').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        window.showEditGuru = function(id) {

        // ============================================================================
        // TUGAS PEGAWAI & JADWAL MENGAJAR

        window.downloadFormatTugas = function() {
            const headers = ['NIK', 'NAMA_PEGAWAI', 'WALI_KELAS', 'TUGAS_TAMBAHAN', 'PELATIH_EKSTRA', 'MAPEL_1', 'KELAS_MAPEL_1', 'MAPEL_2', 'KELAS_MAPEL_2', 'MAPEL_3', 'KELAS_MAPEL_3', 'MAPEL_4', 'KELAS_MAPEL_4', 'MAPEL_5', 'KELAS_MAPEL_5', 'MAPEL_6', 'KELAS_MAPEL_6'];
            const rows = window.DB.guru.map(g => [
                g.nik || '', g.nama || '', g.waliKelas || '', g.tugasTambahan || '', g.pelatihEkstra || '',
                g.mapel1 || '', g.kelasMapel1 || '', g.mapel2 || '', g.kelasMapel2 || '', g.mapel3 || '', g.kelasMapel3 || '',
                g.mapel4 || '', g.kelasMapel4 || '', g.mapel5 || '', g.kelasMapel5 || '', g.mapel6 || '', g.kelasMapel6 || ''
            ]);
            window.exportPremiumExcel({
                sheetName: "TugasPegawai",
                fileName: "Format_Tugas_Pegawai.xlsx",
                headers: headers,
                rows: rows,
                centerCols: [0, 2],
                boldCols: [1],
                getHeaderColor: (colIdx) => {
                    if (colIdx <= 1) return '0F172A';
                    if (colIdx <= 4) return '0F766E';
                    return 'B45309';
                }
            });
        };

        window.triggerUploadTugas = function() { document.getElementById('fileTugas').click(); };
        window.handleUploadTugas = function(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                let updatedCount = 0;
                json.forEach(row => {
                    const rowNik = String(row['NIK'] || '').trim();
                    const rowNama = String(row['NAMA_PEGAWAI'] || row['NAMA'] || '').trim();
                    let g = window.DB.guru.find(x => (rowNik && String(x.nik).trim() === rowNik) || (rowNama && x.nama.toLowerCase() === rowNama.toLowerCase()));
                    if (g) {
                        if (row['WALI_KELAS'] !== undefined) g.waliKelas = row['WALI_KELAS'];
                        if (row['TUGAS_TAMBAHAN'] !== undefined) g.tugasTambahan = row['TUGAS_TAMBAHAN'];
                        if (row['PELATIH_EKSTRA'] !== undefined) g.pelatihEkstra = row['PELATIH_EKSTRA'];
                        for (let i = 1; i <= 6; i++) {
                            if (row[`MAPEL_${i}`] !== undefined) g[`mapel${i}`] = row[`MAPEL_${i}`];
                            if (row[`KELAS_MAPEL_${i}`] !== undefined) g[`kelasMapel${i}`] = row[`KELAS_MAPEL_${i}`];
                        }
                        updatedCount++;
                    }
                });
                window.showToast(updatedCount + ' Tugas Pegawai Diperbarui!');
                window.logActivity('Import Excel Tugas Pegawai', updatedCount + ' Pegawai', 'Tugas Pegawai', 'blue');
                window.render();
                document.getElementById('fileTugas').value = '';
            };
            reader.readAsArrayBuffer(file);
        };

        window.populateTugasFormFields = function(guruId) {
            const g = window.DB.guru.find(x => String(x.id) === String(guruId));
            if (!g) return;
            document.getElementById('t_waliKelas').value = g.waliKelas || '';
            document.getElementById('t_tugasTambahan').value = g.tugasTambahan || '';
            document.getElementById('t_pelatihEkstra').value = g.pelatihEkstra || '';
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`t_mapel${i}`).value = g[`mapel${i}`] || '';
                document.getElementById(`t_kelasMapel${i}`).value = g[`kelasMapel${i}`] || '';
            }
        };

        window.showEditTugas = function(id) {
            if (window.DB.guru.length === 0) {
                window.showToast('Belum ada Data Pegawai! Tambahkan di menu Data Pegawai terlebih dahulu.', 'alert-circle', 'text-orange-500');

            const selectedGuru = id ? window.DB.guru.find(x => x.id === id) : window.DB.guru[0];

            const guruOptions = window.DB.guru.map(item => 
                `<option value="${item.id}" ${selectedGuru && selectedGuru.id === item.id ? 'selected' : ''}>${item.nama} ${item.namaGelar || ''} (NIK: ${item.nik || '-'})</option>`
            ).join('');

            let mapelInputsHtml = '';
            for (let i = 1; i <= 6; i++) {
                mapelInputsHtml += `

            }

            const formHtml = `
                <div class="mb-4 border-b border-gray-200 pb-3">

                        <label class="text-[10px] font-extrabold text-brand-blue uppercase">PILIH PEGAWAI (DARI DATA PEGAWAI)</label>
                        <select id="t_guruId" onchange="populateTugasFormFields(this.value)" class="input-glass font-bold text-brand-navy cursor-pointer">
                            ${guruOptions}
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-brand-muted uppercase">WALI KELAS</label>
                            <input type="text" id="t_waliKelas" value="${selectedGuru.waliKelas || ''}" class="input-glass" placeholder="Contoh: 6A">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-bold text-brand-muted uppercase">TUGAS TAMBAHAN</label>
                            <input type="text" id="t_tugasTambahan" value="${selectedGuru.tugasTambahan || ''}" class="input-glass" placeholder="Contoh: Wakasek Kurikulum">

                            <input type="text" id="t_pelatihEkstra" value="${selectedGuru.pelatihEkstra || ''}" class="input-glass" placeholder="Contoh: Pramuka, Futsal">
                        </div>
                    </div>

                    <div class="mt-1">
                        <div class="text-[11px] font-extrabold text-brand-navy mb-2 flex items-center gap-1.5">
                            <i data-lucide="book-open" class="w-3.5 h-3.5 text-orange-500"></i> Jadwal Mengajar Mata Pelajaran (Maksimal 6 Mapel)
                        </div>
                        <div class="flex flex-col gap-2.5">
                            ${mapelInputsHtml}
                        </div>
                    </div>
                </form>
                <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-brand-muted hover:bg-gray-100 rounded-xl">Batal</button>
                    <button type="submit" form="tugasForm" class="px-5 py-2 text-xs font-bold bg-blue-500 text-white rounded-xl shadow-md hover:bg-blue-600 flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5"></i> Simpan Tugas</button>
                </div>`;
            window.openModal(formHtml);
        };

        window.saveEditTugas = function(e) {
            e.preventDefault();
            const selectedId = document.getElementById('t_guruId').value;
            let g = window.DB.guru.find(x => String(x.id) === String(selectedId));
            if (!g) return;

            g.waliKelas = document.getElementById('t_waliKelas').value.trim();
            g.tugasTambahan = document.getElementById('t_tugasTambahan').value.trim();
            g.pelatihEkstra = document.getElementById('t_pelatihEkstra').value.trim();
            for (let i = 1; i <= 6; i++) {
                g[`mapel${i}`] = document.getElementById(`t_mapel${i}`).value.trim();
                g[`kelasMapel${i}`] = document.getElementById(`t_kelasMapel${i}`).value.trim();
            }

            window.logActivity('Memperbarui Tugas Pegawai', g.nama, 'Tugas Pegawai', 'blue');

            window.render();

        window.triggerTugasSearch = function(val) { window.state.searchQueryTugas = val.toLowerCase(); window.render(); };
        window.renderAdminTugasPegawai = function() {
            const q = window.state.searchQueryTugas;
            const filteredGuru = window.DB.guru.filter(g => {
                if (!q) return true;
                const nama = (g.nama || '').toLowerCase(); const tTambahan = (g.tugasTambahan || '').toLowerCase(); const pEkstra = (g.pelatihEkstra || '').toLowerCase();
                const m1 = (g.mapel1 || '').toLowerCase(); const m2 = (g.mapel2 || '').toLowerCase(); const m3 = (g.mapel3 || '').toLowerCase();
                const m4 = (g.mapel4 || '').toLowerCase(); const m5 = (g.mapel5 || '').toLowerCase(); const m6 = (g.mapel6 || '').toLowerCase();
                return nama.includes(q) || tTambahan.includes(q) || pEkstra.includes(q) || m1.includes(q) || m2.includes(q) || m3.includes(q) || m4.includes(q) || m5.includes(q) || m6.includes(q);
            });

            const trs = filteredGuru.map((g, idx) => {
                let cols = '';
                for (let i = 1; i <= 6; i++) {
                    const mapel = g[`mapel${i}`] || ''; const kelas = g[`kelasMapel${i}`] || ''; const isFilled = mapel.trim() !== '';

            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                const baseId = Date.now();
                const importedRows = json.map((row, i) => {
                    let s = { id: baseId + i, password: DEFAULT_PASSWORD, status: true };
                    SISWA_KEYS.forEach((k, kid) => {
                        let val = row[SISWA_HEADERS[kid]] !== undefined ? row[SISWA_HEADERS[kid]] : '';
                        if (k === 'tgl_lahir' || k === 'tgl_kk' || k === 'ayah_tahun_lahir' || k === 'ibu_tahun_lahir') {
                            val = window.formatDateId(val);

                        if (k === 'password') {
                            val = String(val || DEFAULT_PASSWORD).trim() || DEFAULT_PASSWORD;
                        }
                        s[k] = val;
                    });
                    if (!s.no) s.no = String(i + 1);
                    return s;
                });
                if (importedRows.length > 0) {
                    window.DB.siswa = ensureNaturalSiswaOrder(importedRows);

                                    <th class="py-2.5 px-4 text-[10px] font-bold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENDIDIKAN IBU</th>
                                    <th class="py-2.5 px-4 text-[10px] font-bold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PEKERJAAN IBU</th>
                                    <th class="py-2.5 px-4 text-[10px] font-bold text-brand-navy uppercase whitespace-nowrap text-center sticky-top-th bg-[#fed7aa]">PENGHASILAN IBU</th>

        window.renderAdminLogs = function() {
            const rows = window.DB.logs.map(l => `<div class="flex items-start gap-3.5 p-3.5 border-b border-white/30 hover:bg-white/30 transition-colors"><div class="w-9 h-9 rounded-full bg-${l.color}-100 flex items-center justify-center border border-white shrink-0"><i data-lucide="activity" class="w-4 h-4 text-${l.color}-500"></i></div><div class="flex-1 min-w-0"><h4 class="text-[12px] font-bold text-brand-navy leading-tight">${l.action} <span class="text-brand-blue">${l.target}</span></h4><div class="flex items-center gap-2.5 mt-1"><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${l.user}</span><span class="text-[9px] font-bold text-brand-muted flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${l.time}</span><span class="text-[9px] font-bold px-1.5 py-0.5 bg-white/60 border border-white rounded text-brand-muted ml-auto">${l.type}</span></div></div></div>`).join('');
            return `<div class="p-4 md:p-6 w-full h-full flex flex-col box-border animate-fade"><div class="glass-panel p-4 rounded-[20px] mb-5 shrink-0"><h1 class="text-[18px] font-extrabold text-brand-navy">Log Aktivitas</h1><p class="text-[11px] text-brand-muted mt-0.5">Riwayat tindakan penting di sistem.</p></div><div class="glass-panel rounded-[20px] flex-1 overflow-y-auto slider-scroll p-1 w-full">${rows}</div></div>`;
        };

        window.render = function() {
            const root = document.getElementById('app-root');
            const isMobile = window.innerWidth < 768;
            const isAdminView = window.state.path.startsWith('#admin');

            if (isAdminView && (!window.state.isLoggedIn || !['Super Admin', 'Admin'].includes(window.state.user.role))) {
                window.navigate('#login');
                return;
            }

            if (isAdminView) {
                let adminContent = '';
                switch(window.state.path) {
                    case '#admin-dashboard': adminContent = window.renderAdminDashboard(); break;
                    case '#admin-menu-apps': adminContent = window.renderAdminMenuApps(); break;
                    case '#admin-users': adminContent = window.renderAdminUsers(); break;
                    case '#admin-guru': adminContent = window.renderAdminGuru(); break;
                    case '#admin-tugas-pegawai': adminContent = window.renderAdminTugasPegawai(); break;
                    case '#admin-siswa': adminContent = window.renderAdminSiswa(); break;
                    case '#admin-logs': adminContent = window.renderAdminLogs(); break;
                    default: adminContent = window.renderAdminDashboard();
                }
                const existingShell = document.getElementById('admin-shell-layout');
                if (existingShell && existingShell.dataset.mobile === String(isMobile)) {
                    document.getElementById('admin-main-content').innerHTML = adminContent;
                    if (!isMobile) {
                        const sidebarLinks = document.getElementById('admin-sidebar-links');
                        if (sidebarLinks) sidebarLinks.innerHTML = window.getAdminSidebarLinks();
                    } else {
                        const mobileLinks = document.getElementById('admin-mobile-links');
                        if (mobileLinks) mobileLinks.innerHTML = window.getAdminMobileNavLinks();
                    }
                } else {
                    const uAvatar = window.state.user.avatar || window.getUserAvatarUrl(window.state.user.name);
                    root.innerHTML = `<div id="admin-shell-layout" data-mobile="${isMobile}" class="flex h-[100dvh] w-full overflow-hidden relative">${!isMobile ? `<aside class="w-[200px] shrink-0 bg-white/30 border-r border-white/50 backdrop-blur-3xl z-40 flex flex-col"><div class="h-[60px] flex items-center gap-2.5 px-3.5 border-b border-white/40 cursor-pointer" onclick="navigate('#home')">${macOsDotsHtml}<div class="flex items-center gap-2 min-w-0"><div class="w-8 h-8 shrink-0">${logoSvg}</div><div class="flex flex-col min-w-0"><span class="text-[13.5px] font-extrabold text-brand-navy leading-none truncate">My Alka</span><span class="text-[8.5px] font-bold text-brand-blue uppercase tracking-wider mt-1">Admin Panel</span></div></div></div><nav id="admin-sidebar-links" class="flex flex-col gap-1.5 p-3">${window.getAdminSidebarLinks()}</nav></aside>` : ''}<div class="flex-1 flex flex-col h-full relative w-full overflow-hidden ${isMobile ? 'pb-[70px]' : ''}"><header class="h-[56px] md:h-[60px] flex items-center justify-between px-4 md:px-6 shrink-0 z-30 bg-white/20 backdrop-blur-md border-b border-white/40 w-full"><div class="flex items-center gap-2 font-bold text-brand-navy text-[14px] md:hidden">${macOsDotsHtml}<span>Admin Panel</span></div><div class="flex items-center gap-3 ml-auto relative"><button onclick="navigate('#home')" class="glass-pill px-3 py-1.5 rounded-full text-[11px] font-bold text-brand-navy flex items-center gap-1.5 hover:bg-white shadow-sm mr-1"><i data-lucide="monitor" class="w-3.5 h-3.5"></i> Lihat Portal</button><div class="w-7 h-7 rounded-full border border-white shadow-sm bg-blue-100 overflow-hidden"><img src="${uAvatar}" class="w-full h-full object-cover"></div><span class="text-[11px] font-bold text-brand-navy hidden md:block">${window.state.user.name}</span></div></header><main id="admin-main-content" class="flex-1 overflow-hidden relative w-full">${adminContent}</main></div>${isMobile ? `<nav id="admin-mobile-links" class="bottom-nav border-t border-white/80 bg-white/80">${window.getAdminMobileNavLinks()}</nav>` : ''}</div>`;
                }
            } else {
                root.innerHTML = window.renderPortalLayout(isMobile);
            }
            window.renderPwaFloatingBanner();
            setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 10);
            window.renderNotifItems();
        };

        window.addEventListener('resize', () => {
            const isMobile = window.innerWidth < 768;
            const existingShell = document.getElementById('admin-shell-layout');
            if (existingShell && existingShell.dataset.mobile !== String(isMobile)) window.render();
            window.renderPwaFloatingBanner();
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 700);
                }, 1800);
            }

            window.initMBankingSecurity();
            window.initSmartPWA();
            initCloud();
        });
